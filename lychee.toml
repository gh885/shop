# lychee 配置：文档链接检查（门禁用）。
#
# 管什么：markdown 里的**本地链接**——相对路径、跨文档引用、指向某个标题的锚点。
# 为什么值得设成门禁：这类链接坏掉是**静默**的。文件改名、目录挪走、标题重写之后，
# 链接文字照旧显示，只有点下去才发现 404；而 `AGENTS.md` / `docs/` 是 AI 读的上下文，
# 引用断了不会报错，只会让上下文悄悄少一块——没人会发现，直到答案开始不对劲。
#
# ── 为什么是 offline ──
# 门禁要**确定性**（与 zizmor 选 --offline 同一个理由）：联网查外部链接会因上游抖动、
# 限流、站点临时下线而红，那种红没有可行动的信号，只会训练人忽略这条门禁。
# **代价必须写清楚：offline 下外部 URL 一律算 Excluded，完全不检查。**
# 所以这条门禁保证的是「本地引用没有断」，不是「所有链接都能打开」。
# 想顺带查外部链接（人工、非门禁）：
#     mise exec -- lychee --no-progress docs
#
# 为什么限定扩展名：仓库里被跟踪的 html 只有三个 SPA 入口模板和一个 perf 夹具。
# 入口模板里的 `/assets/*.js` 是构建期才存在的绝对路径，检查它得配 root_dir，
# 配了也只是在验证「构建产物在不在」——那不是文档链接问题。不限定扩展名还会让
# lychee 把 `apps/server/pom.xml` 当成 sitemap 去读，刷一条无意义的 WARN。
extensions = ["md"]

# 只查本地文件，屏蔽所有网络请求。
offline = true

# CI 是非交互 shell，进度条只会往日志里塞转义序列。
no_progress = true

# 检查锚点（anchor-only：只查 `#标题`，不查 `#:~:text=` 文本片段）。
# 这是本配置里最值钱的一项：没有它，「标题被改名、链接还指着旧锚点」查不出来，
# 而这恰好是文档最常见、也最难靠人眼发现的退化——它连 File not found 都不会报。
include_fragments = "anchor-only"

# 逐条给「文件:行:列 + 原因」，在 CI 日志里能直接跳到出事那行。
format = "detailed"
