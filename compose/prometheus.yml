# 本地指标抓取：Spring Boot 的 /actuator/prometheus 端点跑在宿主机上，容器里用 host.docker.internal 访问。
global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    - job_name: shop-server
      metrics_path: /actuator/prometheus
      static_configs:
          - targets: ["host.docker.internal:8080"]
