# yaml-language-server: $schema=./node_modules/lefthook/schema.json
# 用本地 schema：schemastore.org 上的托管副本落后于 2.1.10，会误报 jobs/exclude 非法
#
# 逃生舱（别用 --no-verify，它连 commitlint 一起跳过）：
#   LEFTHOOK=0 git commit …              跳过全部钩子
#   LEFTHOOK_EXCLUDE=lint git commit …   按 tag/name 跳过单个作业

min_version: 2.1.10
assert_lefthook_installed: true
colors: true

# ── pre-commit：轻量检查，只跑暂存文件 ──
pre-commit:
    # 冲突解决与交互式 rebase 期间每个 commit 都会触发，纯噪音
    skip:
        - merge
        - rebase

    # 生成物与锁文件不参与格式化/lint
    # routeTree.gen.ts 被 oxfmt 改写后会被路由插件再生成回去，来回抖动
    exclude:
        - "**/*.gen.ts"
        - "pnpm-lock.yaml"

    jobs:
        # 前端／通用文件格式化
        # --no-error-on-unmatched-pattern：{staged_files} 可能整体落在忽略名单里
        # （名单现在住在根 vite.config.ts 的 fmt.ignorePatterns：packages/api/src/sdk/、**/*.gen.ts、
        # openapi/api-docs.json、pnpm-workspace.yaml），此时 oxfmt 找不到任何
        # 可格式化的目标，默认以 2 退出。两个作业都要带这个参数，否则「只提交一次契约/SDK 重生成」
        # 这类完全干净、也确实无可格式化的提交会被钩子拦下。
        - name: fmt-web
          tags: [format]
          glob: "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,yml,yaml,md}"
          run: pnpm exec vp fmt --no-error-on-unmatched-pattern --write {staged_files}
          stage_fixed: true

        # 后端 Java 格式化（只当有 .java 文件变更时触发）
        - name: fmt-java
          tags: [format]
          glob: "**/*.java"
          timeout: 120s
          run: mvn -f apps/server/pom.xml spotless:apply -q
          stage_fixed: true

        # 前端 lint
        # --no-error-on-unmatched-pattern：同一类问题（见上）。最典型的触发是只提交 SDK 重生成产物
        # —— packages/api/src/sdk/index.ts 不在 lefthook 的 exclude 里，会被交给 oxlint，
        # 但它在忽略名单里（**/sdk/**，住在根 vite.config.ts 的 lint.ignorePatterns），于是 oxlint 拿到空集并以 1 退出。
        # 全量 lint（pre-push 的 lint 作业与 pnpm lint:web）lint 的是 "."，不会空集，故不加此参数。
        - name: lint-web
          tags: [lint]
          glob: "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
          run: pnpm exec vp lint --type-aware --no-error-on-unmatched-pattern {staged_files}
          fail_text: "oxlint 未通过；可自动修复的部分跑 pnpm lint:web:fix"

        # 密钥扫描。只扫**暂存内容**（--staged）：工作区里躺着 apps/server/.env（gitignored）
        # 和 dist/ / target/ 构建产物，扫它们只会报一堆根本进不了仓库的噪音——实测同一时刻
        # 「扫工作区 18 处 vs 扫暂存 0 处」，18 处全是误报。git 全历史的扫描归 CI 那条，
        # 因为「曾经提交过、后来删掉」的密钥本地扫不出来（除非扫全历史，那太慢，不该压在每个 commit 上）。
        # 规则与放行理由见 .gitleaks.toml；历史残留放行见 .gitleaksignore。
        # 没装 gitleaks 时跳过并提示（装法 mise install，版本钉在仓库根 mise.toml）——
        # 本地可以没有，CI 上这条是硬门禁，绕不过去。
        #
        # **判定与调用都在 scripts/secret-scan.mjs 里，这里只调用它**：原先内联写成多行
        # `run: |`（if 判 gitleaks 在不在 + 调扫描），Windows 上 lefthook 交给 `sh -c` 时
        # 脚本被拆坏，报 `-c: line 3: syntax error: unexpected end of file from 'if' command
        # on line 1`——于是这条钩子在 Windows 上必然失败，且失败得毫无信息量（根本没开始扫）。
        # 脚本里 decide() 是纯函数，有单测（scripts/secret-scan.test.mjs）。
        # 手动复现/调试直接跑 `pnpm secret:scan`（同一条命令，只是多一层 pnpm）。
        - name: secret-scan
          tags: [security]
          run: node scripts/secret-scan.mjs
          fail_text: "检测到疑似密钥。误报请改 .gitleaks.toml 的 allowlist 并写清理由；确实是密钥请**轮换**它——光删提交没用，值已经进过本地历史。"

        # 以下两项不按暂存文件过滤，但带缓存各 ~1s 内，放 pre-commit 而非 pre-push：仓库没有 remote 时
        # pre-push 永不触发。代价是审的是工作区（含未暂存改动），不严格等于本次提交
        # 死代码 + 架构边界**方向**（域不许到 routes/shell、shared 不许到 domain 等），配置在 .fallowrc.json。
        # 注意「域间只许引对方 index.ts」（frontend.md「依赖方向」）**不在这里**了：fallow 3.31 起
        # boundary 按源模块的 zone 判定，barrel 那一跳不再算数，这条已移交 oxlint
        # （packages/config/oxlint.config.ts 的 DOMAIN_BARREL_OVERRIDES），由上面的 lint-web 拦。
        - name: dead-code
          tags: [arch]
          run: pnpm fallow

        # 同族但另一视角：--production 把 test/spec/dev 整批从发现范围里剔除，
        # 于是「只给测试用的导出」会变成真的没有生产消费者。两者能各报各的：上面那条看得到
        # 测试文件当入口的情形，这条看不到（DETAIL_FIRST_CODES 就是这么在 CI 炸的）。
        # ~0.6s，放 pre-commit 不心疼。
        - name: dead-code-production
          tags: [arch]
          run: pnpm fallow:production

        # 只审改动（基准：与上游的 merge-base，无上游时取本地 main）：新引入的死代码 / 超标复杂度 / 重复代码才拦，
        # 历史存量不算，所以 health 与 dupes 不用维护基线文件也只许变好
        - name: audit
          tags: [arch]
          run: pnpm exec fallow audit

        # 层叠带：业务代码（apps/<app>/src）里不许出现裸数值的全局层叠（z-30 及以上、
        # z-[…] 任意值、内联 zIndex>=30），只许用 z-sticky / z-chrome / z-overlay / z-toast
        # 四个 token（由 --z-index-* 生成，改档位只改一处）。
        # DESIGN.md §2.4 那句"业务侧不写 z-* 去抢弹窗"一直没牙——`shadcn/no-arbitrary-values`
        # 只拦 z-[35]，`z-50` 是合法类名。2026-10 的浮层审查实测：全站浮层散在 24 处裸 z-50、
        # 吸顶有 z-30/z-40 两套口径，后果是层级只能靠挂载顺序决定（toast 被弹窗遮罩压住）。
        # 纯文本扫、~10ms，所以放 pre-commit。判定在 scripts/z-index-guard.mjs（有单测）。
        - name: z-index-guard
          tags: [arch]
          run: pnpm z-index:guard
          fail_text: "业务侧写了裸数值层叠。档位表见 packages/ui-web/DESIGN.md §2.4；改法：换成 z-sticky / z-chrome / z-overlay / z-toast。"

        # 设计 token：三条纪律（DESIGN.md §2.1 / §2.2）过去只写在注释里——
        # ① Layer 1 色阶只许语义层 var() 引用：`bg-neutral-500` 是**合法类名**，
        #    命中的是 Tailwind 内置色板（我们的叫 --neutral-500），页面看着正常、颜色是别人的；
        # ② 死 primitive：声明了没人 var() 引用（2026-10 实测 51 个里 26 个是死的，已删净）；
        # ③ 死语义色：`--color-*` 没有 bg-/text-/var() 一类的消费者。
        # 纯文本扫、~0.2s，所以放 pre-commit。判定在 scripts/token-guard.mjs（有单测）。
        - name: token-guard
          tags: [arch]
          run: pnpm token:guard
          fail_text: "token 用法越界或存在死 token。口径见 packages/ui-web/DESIGN.md §2.1（分层）；primitive 只许 var() 引用，色阶值只在 packages/ui-web/src/styles.css 声明。"

# ── commit-msg：Conventional Commits 校验 ──
commit-msg:
    jobs:
        - name: commitlint
          run: pnpm commitlint --edit {1}
          fail_text: "提交信息格式不符合规范，请参考 Conventional Commits 规范"

# ── pre-push：重量检查，全量跑；各项互不依赖，并行 ──
#
# 与 CI 的分工（刻意不是「CI 的子集」，而是按「能不能给出可行动的信号」分）：
#   pre-push 装下所有**便宜且确定**的门：前端 check/typecheck/test（带缓存）、后端免库静态家族。
#   这两类都是几十秒内、结果确定、且失败时你能立刻在本地复现的。
#   CI 独占地跑那类「要么需要一整套环境、要么贵到不该压在人肉等待上」的：
#     - `mvn verify` 全量（含连库的 @SpringBootTest / 契约测试，要 PG+Redis 起得来）
#     - Playwright e2e（要后端 + web + seller 三处同起，还要跨角色上下文）
#   代价是两个真实反馈会晚一轮（~5–7 分钟 CI）才到：那类失败本地确实也复现不了，
#   压进 pre-push 只会把每次 push 拖成分钟级、并让人学会用 LEFTHOOK_EXCLUDE 绕开。
#   反过来，凡是便宜的门**一律**要进 pre-push/pre-commit，否则就会变成「CI 炸了才发现本地早能拦」——
#   dead-code 的 --production 视角就曾这样漏过（它比普通视角多剔掉 test/spec/dev）。
pre-push:
    parallel: true
    skip:
        - merge
        - rebase

    jobs:
        # 前端三项（fmt+lint 的 vp check / typecheck / test）合并成一个带缓存的入口：
        # `pnpm exec vp run verify` 与本地手动验证是同一个命令、同一套指纹（定义在根
        # vite.config.ts 的 run.tasks.verify），所以「手动验完再 push」不再重跑一遍全量测试——
        # 源码/测试/配置/依赖任一变化照常失效，完全相同的状态直接重放记录的结果。
        # 冷跑仍是全量一遍（实测 ~54s），这里省的是第二次等待。
        # tags 三个都留着：LEFTHOOK_EXCLUDE=lint/types/test 的逃生舱仍按原来粒度跳过。
        - name: verify
          tags: [lint, types, test]
          timeout: 600s
          run: pnpm exec vp run verify

        # 死代码 / 改动审计（fallow）在 pre-commit，见那边的说明

        # 后端本地只编译过一次历史，CI 跑 mvn verify 全量——架构规则/词表普查
        # （NamingRulesTest、FieldRuleVocabularyTest 这类）不连库、~7s，却从没在
        # push 前跑过，命名越界/边界没登记就红着推进 CI。这里补上这条免库静态家族；
        # 连库的 @SpringBootTest/契约测试仍归 pnpm test:server 与 CI，不塞进 push 热路径。
        #
        # 挑选口径：按 @Tag("contract") 显式声明，不再靠类名后缀（原先的
        # `-Dtest='*VocabularyTest,*RulesTest,MoneyTest,...'` 是「命名后缀 + 逐个点名」混着挑，
        # 新守卫若没带那两个后缀、又没手动进清单，就会静默漏出 push 门禁——FilterErrorOutputTest
        # 正是这样一个「免库守卫但命名不带后缀」的活样本，切到 tag 后它自动被纳入）。
        # MoneyTest 是 Money 值对象的行为单测、不是防漂移守卫，故刻意不打 tag、不进这一组，
        # 它照常随 mvn test / CI verify 跑。
        - name: java-build
          tags: [java]
          timeout: 300s
          run: mvn -f apps/server/pom.xml test -q -Dgroups=contract

        # 契约漂移检查：SDK 生成物（含 zod 校验 schema）与 api-docs.json 同步；
        # 后端在跑时顺带比对运行中契约（脚本内部自动跳过）
        - name: sdk-drift
          tags: [contract]
          run: pnpm sdk:drift

        # 手打契约形状漂移：业务代码里手写的匿名对象形状逐字等于契约类型时，就该直接引契约
        # 而不是重打一遍。形状一旦有两个来源必漂移——契约加一列，手打那份**不报错**、
        # 只是静默传不上去，只在联调时才浮出来。与上面 sdk-drift 同一性质（形状只许一个来源），
        # 但看的是业务代码而不是生成物。纯文本扫，~0.3s。
        - name: types-drift
          tags: [contract]
          timeout: 60s
          run: pnpm types:drift

        # 路由/CORS 口径漂移：同一份「哪些路径转后端 + 开发期跨域白名单」手抄在 nginx shop.conf、
        # 三端 vite.config.ts 的 proxy、application.yml 的 cors-allowed-origins 三处，改一边忘另一边
        # 是静默失配（部署后该前缀 404 / 走错上游，本地 Vite proxy 同源走不出来）。真相源是
        # contracts/routing.yaml，脚本把它和三处交叉比对。纯文本读、~几十 ms。
        - name: routing-drift
          tags: [contract]
          timeout: 60s
          run: pnpm routing:drift

        # 文案生成物漂移：资源 JSON 改了而 messages.gen.ts 没跟着改，本地 push 就拦。
        # CI 的 i18n 步骤跑的是同一条命令，但把「生成物没跟上」交给 CI 才知道，
        # 等于让 §10.1 判据 3「自动执行」只剩一半——所以这里要有独立作业，
        # 也不塞进上面的 verify：verify 按指纹缓存重放，塞进去会把 0.4s 的热跑变成每次重跑 codegen
        - name: i18n-drift
          tags: [i18n]
          timeout: 60s
          run: pnpm i18n:drift

        # 错误码生成物漂移：contracts/error-codes.mjs 改了而 ErrorCodes.java / error-codes.ts 没跟上，
        # 本地 push 就拦。比 i18n 那条更值得拦：码拼错是无声的（编译过、运行时才 500），
        # 而比对是语义的（spotless 会把 javadoc 重排，逐字节比会天天假红），见脚本头注释。
        - name: errors-drift
          tags: [contract]
          timeout: 60s
          run: pnpm errors:drift

        # 权限码生成物漂移：contracts/permissions.mjs 改了而 Permissions.java / permission-codes.ts 没跟上，
        # 本地 push 就拦。与 errors-drift 同性质（词表只许一个来源、比对是语义的），
        # 判权码拼错同样是无声的——注解改字面量等于把那道判权换个名字继续跑。~几十 ms。
        - name: permissions-drift
          tags: [contract]
          timeout: 60s
          run: pnpm permissions:drift

        # 文档链接：markdown 里的相对路径 / 跨文档引用 / 锚点。全量跑、~40ms。
        # 放 pre-push 而不是 pre-commit：它是**整仓**检查（不是按暂存文件过滤），
        # 与上面三条 drift 同一性质；而它一坏就坏在「文档被改名」这种与本次提交无关的事上，
        # 压在每次 commit 上只会让人学会用 LEFTHOOK_EXCLUDE 绕开。
        # 配置全在仓库根 lychee.toml（离线、查锚点、只收 md），这里不加参数以免两处漂移。
        - name: docs-links
          tags: [docs]
          timeout: 60s
          run: lychee .

        # monorepo 一致性：同一个依赖在不同包里版本不一致、空依赖字段、依赖没按字母序、
        # workspace 通配符指向不存在的目录…… ~2ms，且不需要 node_modules。
        # 与 pnpm 的 catalogMode: strict 是两侧：那管 `pnpm add` 的写入，手改 package.json
        # 塞显式版本它拦不住，这一格由 sherif 补。failOnWarnings 开在根 package.json 的
        # sherif 字段里（CI 那份读的是同一处），所以这里不加参数。
        # tags 用 arch：与 pre-commit 的 dead-code / audit 同一族（都是「仓库结构」类）。
        - name: monorepo-lint
          tags: [arch]
          timeout: 60s
          run: sherif

        # 数据库迁移 lint：只查「相对基线新增 / 改动的迁移」（增量由 scripts/db-migrations-lint.mjs
        # 算），不查历史已上生产的迁移——迁移不可变，全量查只会让 V9 这类老迁移让 CI 永远红。
        # 拦的是停机事故：非并发建/删索引、加非空列无默认、改列类型、加约束不 NOT VALID、
        # 删列/表/非空、缺 lock_timeout/statement_timeout、迁移不可幂等重跑（缺 IF [NOT] EXISTS）。
        # 规则与排除项在仓库根 .squawk.toml（纯风格规则 prefer-text-field / prefer-bigint-* /
        # prefer-identity 已剔除，只留停机风险类）。
        # ~3s、确定性、失败本地能复现——进 pre-push；CI 那条（db-migrations job）是硬门禁，
        # 但晚一轮才到，本地先拦更便宜。
        # 依赖 squawk-cli（pnpm install 后才有）；没装时脚本会因找不到 squawk 自然失败，提醒先装。
        - name: db-migrations
          tags: [db]
          timeout: 60s
          run: pnpm db:migrations:lint
