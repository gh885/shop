# yaml-language-server: $schema=./node_modules/lefthook/schema.json
# 用本地 schema：schemastore.org 上的托管副本落后于 2.1.10，会误报 jobs/exclude 非法
#
# 逃生舱（别用 --no-verify，它连 commitlint 一起跳过）：
#   LEFTHOOK=0 git commit …              跳过全部钩子
#   LEFTHOOK_EXCLUDE=lint git commit …   按 tag/name 跳过单个作业

min_version: 2.1.10
assert_lefthook_installed: true
colors: true

# ── pre-commit：轻量检查，只跑暂存文件 ──
pre-commit:
    # 冲突解决与交互式 rebase 期间每个 commit 都会触发，纯噪音
    skip:
        - merge
        - rebase

    # 生成物与锁文件不参与格式化/lint
    # routeTree.gen.ts 被 oxfmt 改写后会被路由插件再生成回去，来回抖动
    exclude:
        - "**/*.gen.ts"
        - "pnpm-lock.yaml"

    jobs:
        # 前端／通用文件格式化
        # --no-error-on-unmatched-pattern：{staged_files} 可能整体落在 .prettierignore 里
        # （packages/api/src/sdk/、**/*.gen.ts、openapi/api-docs.json），此时 oxfmt 找不到任何
        # 可格式化的目标，默认以 2 退出。两个作业都要带这个参数，否则「只提交一次契约/SDK 重生成」
        # 这类完全干净、也确实无可格式化的提交会被钩子拦下。
        - name: fmt-web
          tags: [format]
          glob: "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,yml,yaml,md}"
          run: pnpm oxfmt --no-error-on-unmatched-pattern --config packages/config/oxfmt.config.ts --write {staged_files}
          stage_fixed: true

        # 后端 Java 格式化（只当有 .java 文件变更时触发）
        - name: fmt-java
          tags: [format]
          glob: "**/*.java"
          timeout: 120s
          run: mvn -f apps/server/pom.xml spotless:apply -q
          stage_fixed: true

        # 前端 lint
        # --no-error-on-unmatched-pattern：同一类问题（见上）。最典型的触发是只提交 SDK 重生成产物
        # —— packages/api/src/sdk/index.ts 不在 lefthook 的 exclude 里，会被交给 oxlint，
        # 但它在 .eslintignore 里（**/sdk/**），于是 oxlint 拿到空集并以 1 退出。
        # 全量 lint（pre-push 的 lint 作业与 pnpm lint:web）lint 的是 "."，不会空集，故不加此参数。
        - name: lint-web
          tags: [lint]
          glob: "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
          run: pnpm oxlint --type-aware --no-error-on-unmatched-pattern --config packages/config/oxlint.config.ts {staged_files}
          fail_text: "oxlint 未通过；可自动修复的部分跑 pnpm lint:web:fix"

        # 以下两项不按暂存文件过滤，但带缓存各 ~1s 内，放 pre-commit 而非 pre-push：仓库没有 remote 时
        # pre-push 永不触发。代价是审的是工作区（含未暂存改动），不严格等于本次提交
        # 死代码 + 架构边界：域间只许引对方 index.ts（frontend.md「依赖方向」），配置在 .fallowrc.json
        - name: dead-code
          tags: [arch]
          run: pnpm fallow

        # 只审改动（基准：与上游的 merge-base，无上游时取本地 main）：新引入的死代码 / 超标复杂度 / 重复代码才拦，
        # 历史存量不算，所以 health 与 dupes 不用维护基线文件也只许变好
        - name: audit
          tags: [arch]
          run: pnpm exec fallow audit

# ── commit-msg：Conventional Commits 校验 ──
commit-msg:
    jobs:
        - name: commitlint
          run: pnpm commitlint --edit {1}
          fail_text: "提交信息格式不符合规范，请参考 Conventional Commits 规范"

# ── pre-push：重量检查，全量跑；各项互不依赖，并行 ──
pre-push:
    parallel: true
    skip:
        - merge
        - rebase

    jobs:
        # 不带 --fix：push 前只校验，不改工作区
        - name: lint
          tags: [lint]
          run: pnpm oxlint --type-aware --config packages/config/oxlint.config.ts .

        - name: typecheck
          tags: [types]
          run: pnpm typecheck

        # 死代码 / 改动审计（fallow）在 pre-commit，见那边的说明

        # 前端单测 + 组件/集成测试（vitest projects：apps/* + packages/*）
        - name: test
          tags: [test]
          timeout: 300s
          run: pnpm test

        - name: java-build
          tags: [java]
          timeout: 300s
          run: mvn -f apps/server/pom.xml compile -q

        # 契约漂移检查：SDK 生成物（含 zod 校验 schema）与 api-docs.json 同步；
        # 后端在跑时顺带比对运行中契约（脚本内部自动跳过）
        - name: sdk-drift
          tags: [contract]
          run: bash scripts/check-sdk-drift.sh
