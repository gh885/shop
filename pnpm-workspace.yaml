overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # msw 的 @types/node peer 会另解析出一份 26.4.1，导致 vitest 出现两个 peer 实例：
  # @testing-library/jest-dom 的 `declare module 'vitest'` 增强落在一份上，
  # vite-plus/test 导出的 Assertion 在另一份上，jest-dom 匹配器在 tsc 里全部失效。
  '@types/node': 'catalog:'
  # 传递依赖漏洞（osv-scanner 2026-10-06 报出 9 条，涉及 3 个包）。全是补丁级升版。
  # 按**受影响区间**顶，不按包名整包顶：brace-expansion 另有 1.x 消费者（大版本不同、
  # API 不兼容），整包顶会把它们一起拽到 5.x。区间写法让 1.x 那份原样保留。
  # 修完请重跑 pnpm exec osv-scanner scan source --lockfile=pnpm-lock.yaml 确认归零。
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'fast-uri@<3.1.8': ^3.1.8
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
