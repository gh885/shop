  - "@oxfmt/binding-linux-arm-gnueabihf@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-arm-musleabihf@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-arm64-musl@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-riscv64-gnu@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-riscv64-musl@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-s390x-gnu@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-x64-gnu@0.61.0 || 0.66.0"
  - "@oxfmt/binding-linux-x64-musl@0.61.0 || 0.66.0"
  - "@oxfmt/binding-openharmony-arm64@0.61.0 || 0.66.0"
  - "@oxfmt/binding-win32-arm64-msvc@0.61.0 || 0.66.0"
  - "@oxfmt/binding-win32-ia32-msvc@0.61.0 || 0.66.0"
  - "@oxfmt/binding-win32-x64-msvc@0.61.0 || 0.66.0"
  - oxfmt@0.61.0 || 0.66.0
  - "@oxlint/binding-android-arm-eabi@1.81.0"
  - "@oxlint/binding-android-arm64@1.81.0"
  - "@oxlint/binding-darwin-arm64@1.81.0"
  - "@oxlint/binding-darwin-x64@1.81.0"
  - "@oxlint/binding-freebsd-x64@1.81.0"
  - "@oxlint/binding-linux-arm-gnueabihf@1.81.0"
  - "@oxlint/binding-linux-arm-musleabihf@1.81.0"
  - "@oxlint/binding-linux-arm64-gnu@1.81.0"
  - "@oxlint/binding-linux-arm64-musl@1.81.0"
  - "@oxlint/binding-linux-ppc64-gnu@1.81.0"
  - "@oxlint/binding-linux-riscv64-gnu@1.81.0"
  - "@oxlint/binding-linux-riscv64-musl@1.81.0"
  - "@oxlint/binding-linux-s390x-gnu@1.81.0"
  - "@oxlint/binding-linux-x64-gnu@1.81.0"
  - "@oxlint/binding-linux-x64-musl@1.81.0"
  - "@oxlint/binding-openharmony-arm64@1.81.0"
  - "@oxlint/binding-win32-arm64-msvc@1.81.0"
  - "@oxlint/binding-win32-ia32-msvc@1.81.0"
  - "@oxlint/binding-win32-x64-msvc@1.81.0"
  - '@types/node@26.4.1 || 26.6.2'
  - lucide-react@1.39.0 || 1.41.0
  - oxlint@1.81.0
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - "@shadcn/lint@0.1.0"
  - '@commitlint/cli@21.2.3'
  - '@commitlint/config-conventional@21.2.3'
  - '@commitlint/config-validator@21.2.3'
  - '@commitlint/ensure@21.2.3'
  - '@commitlint/format@21.2.3'
  - '@commitlint/is-ignored@21.2.3'
  - '@commitlint/lint@21.2.3'
  - '@commitlint/load@21.2.3'
  - '@commitlint/parse@21.2.3'
  - '@commitlint/read@21.2.3'
  - '@commitlint/resolve-extends@21.2.3'
  - '@commitlint/rules@21.2.3'
  - '@commitlint/types@21.2.3'
  - '@voidzero-dev/vite-plus-core@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.0.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.0.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0'
  - vite-plus@1.0.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  # msw 的 @types/node peer 会另解析出一份 26.4.1，导致 vitest 出现两个 peer 实例：
  # @testing-library/jest-dom 的 `declare module 'vitest'` 增强落在一份上，
  # vite-plus/test 导出的 Assertion 在另一份上，jest-dom 匹配器在 tsc 里全部失效。
  '@types/node': 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
