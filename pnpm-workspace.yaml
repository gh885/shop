packages:
  # 显式列出三个前端应用，而不是写 apps/*：apps/server 是 Maven 模块、没有 package.json，
  # 通配符会把它算成「匹配了 workspace 但没有 package.json 的目录」——sherif 的
  # packages-without-package-json 门禁正是查这个。显式列出同时把意图写清楚：
  # 这个 workspace 只收 JS 应用，往后往 apps/ 下放非 JS 目录不必再解释一遍。
  - "apps/web"
  - "apps/seller"
  - "apps/admin"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - lightningcss
catalog:
  typescript: ^7.0.2
  zod: ^4.6.5
  intl-messageformat: ^11.2.15
  i18next: ^26.4.2
  i18next-icu: ^2.4.4
  react-i18next: ^17.0.15
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.3
  date-fns: ^4.4.0
  "@date-fns/tz": ^1.5.0
  react-error-boundary: ^6.1.5
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  "@vitejs/plugin-react": ^6.1.1
  "@tailwindcss/vite": ^4.3.3
  oxc-transform-react: ^0.150.0
  "@tanstack/devtools-vite": ^0.8.5
  "@tanstack/react-devtools": ^0.10.12
  "@tanstack/react-query": ^5.103.1
  "@tanstack/react-query-devtools": ^5.103.1
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/react-table": ^9.2.4
  "@tanstack/router-cli": ^1.167.38
  "@tanstack/router-plugin": ^1.168.40
  lucide-react: ^1.47.0
  "@types/node": ^26.6.2
  vitest: 5.0.1
  jsdom: ^27.4.0
  msw: ^2.15.0
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@testing-library/jest-dom": ^6.10.0
  vite-plus: 1.0.0
  '@vitest/coverage-v8': 5.0.1
  squawk-cli: ^2.67.0
  '@axe-core/playwright': ^4.13.0
# 新依赖一律进 catalog。这是 pnpm 的**写入侧**守卫（管 `pnpm add`），不是 install 侧检查——
# 手改 package.json 塞一个显式版本它拦不住，那一格要靠 review 或 sherif 这类工具。
#   - strict：`pnpm add` 的新依赖自动落进 catalog；要装的版本与 catalog 区间冲突时直接
#     ERR_PNPM_CATALOG_VERSION_MISMATCH 报错，而不是静默装出第二个版本。
#     实测 12.6.0 上不会把 "catalog:" 写进 catalog 自身（pnpm#10176 未复现，写的是正确区间）。
#   - catalogPrune：install 时清掉没人引用的 catalog 条目，防止 catalog 腐烂。
# 与现状一致：catalog 现在就装着 8 个只被单个包用的条目（i18next / tailwindcss /
# react-i18next …），本仓库的 catalog 是「全仓版本登记表」，不只是「跨包共享依赖」。
catalogMode: strict
catalogPrune: true
allowBuilds:
  lefthook: true
  msw: true
