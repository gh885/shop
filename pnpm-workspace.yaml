  - lightningcss
catalog:
  typescript: ^7.0.2
  zod: ^4.6.5
  intl-messageformat: ^12.1.2
  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  tailwindcss: ^4.3.3
  date-fns: ^4.4.0
  react-error-boundary: ^6.1.5
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  "@vitejs/plugin-react": ^6.1.1
  "@tailwindcss/vite": ^4.3.3
  oxc-transform-react: ^0.150.0
  "@tanstack/react-query": ^5.103.1
  "@tanstack/react-router": ^1.170.38
  "@tanstack/react-table": ^9.2.4
  "@tanstack/router-cli": ^1.167.38
  "@tanstack/router-plugin": ^1.168.40
  lucide-react: ^1.47.0
  "@types/node": ^26.6.2
  vitest: 5.0.1
  jsdom: ^27.4.0
  msw: ^2.15.0
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.7
  "@testing-library/jest-dom": ^6.10.0
  vite-plus: 1.0.0
  '@vitest/coverage-v8': 5.0.1
allowBuilds:
  lefthook: true
  msw: true
minimumReleaseAgeExclude:
