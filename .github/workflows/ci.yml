name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    frontend:
        name: 前端 lint / typecheck / 单测
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # 与 lefthook pre-push 同一套命令（不带 --fix：push 前只校验，不改工作区）
            - name: lint
              run: pnpm oxlint --config packages/config/oxlint.config.ts .
            - name: typecheck
              run: pnpm typecheck
            - name: test
              run: pnpm test

    backend:
        name: 后端编译 (Java 25)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            # 集成测试（*IT，连真库）需要 Postgres + Redis 服务，接入时再放开 mvn verify
            - name: compile
              run: mvn -f apps/server/pom.xml compile -q

    contract:
        name: SDK 契约一致性
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: node scripts/contract-audit.mjs
