name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    frontend:
        name: 前端 lint / typecheck / 单测
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # 与 lefthook pre-push 同一套命令（不带 --fix：push 前只校验，不改工作区）
            - name: lint
              run: pnpm oxlint --config packages/config/oxlint.config.ts .
            - name: typecheck
              run: pnpm typecheck
            - name: test
              run: pnpm test

    backend:
        name: 后端编译 + 单测 (Java 25)
        runs-on: ubuntu-latest
        # *Test 里的接口测试跑的是全量上下文（WebControllerTestSupport 刻意不 exclude 数据源，
        # 见其类注释），要连 shop_test 并由 Flyway 从零跑全量迁移建库，所以快环也必须有 PG。
        # 副作用是好的：迁移链能否在干净 PG 18 上从零跑通，从此每次 push 都验一遍。
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop_dev
                    POSTGRES_DB: shop_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U shop -d shop_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            # mvn test 只跑 *Test（单元 / MockMvc）：ArchUnit 那几道架构门禁
            # （MoneyTypeRulesTest / NamingRulesTest / ModularityTests）此前在 CI 上从未执行过。
            # 集成测试（*IT）还缺 Redis 与 shop_test 的清理约定，接入时再放开 mvn verify。
            - name: compile
              run: mvn -f apps/server/pom.xml compile -q
            - name: test
              run: mvn -f apps/server/pom.xml test -q

    contract:
        name: SDK 契约一致性
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: node scripts/contract-audit.mjs
