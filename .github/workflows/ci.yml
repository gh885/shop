name: CI

on:
    push:
        branches: [main]
    pull_request:
    # 手动补跑：新建仓库的首次 push 不会触发 workflow，建仓后第一次跑 CI 得走这里
    workflow_dispatch:

# 同一个 PR / 分支只保留最新一轮；不同 PR 互不取消。
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# 最小权限：GitHub 默认给的 GITHUB_TOKEN 权限随仓库设置浮动，显式收成「只读代码」。
# 没有任何一步需要回写仓库 / 评论 PR / 上传 release，所以 contents: read 就够。
# 这条同时消掉 zizmor 的 excessive-permissions（它按「没显式声明」判，不看实际用了什么）。
permissions:
    contents: read

# ─────────────────────────────────────────────────────────────────────────────
# 关于 action 版本写法（2026-10 起）：一律钉到 commit SHA，而不是 @v4 这类移动 tag。
# 理由是供应链：tag 可以被上游重指（tag hijack），SHA 不能。zizmor 的 unpinned-uses
# 把「用 tag」判成 High，16 处全在这份文件里。
# 代价是上游发补丁不会自动生效——升级方式：
#   mise exec -- zizmor --fix .github/workflows   （它会联网解析新 SHA）
# 或手工 gh api repos/<owner>/<repo>/commits/<tag> --jq .sha。
# 行尾的 `# vX` 注释是给人看的，工具不读它。
# ─────────────────────────────────────────────────────────────────────────────

jobs:
    # 与前后端都无关的一类门禁：密钥、依赖漏洞、工作流本身、文档链接、monorepo 一致性。
    # 独立成 job 与其它并行，它不装项目依赖、不连数据面，所以最便宜（~1 分钟），
    # 也最适合最先失败。
    # 注：job 名（安全与工作流门禁）比实际范围窄了——改它要同步改远端 required check
    # 的名字，所以留着，别为了改名把分支保护搞坏。
    security:
        name: 安全与工作流门禁
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            # 全历史扫描要完整历史（gitleaks 查的是「提交过的」密钥，不是「当前文件里的」）
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            # 工具版本唯一真相源是仓库根的 mise.toml（本机 lefthook 钩子走同一份），
            # 所以这里不手抄版本号。mise 是本仓库既有的工具管理器（Node/Java 都归它）。
            - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
              with:
                  cache: true
            # 全历史（含所有分支的提交）。历史里的泄漏改不掉，只能轮换密钥——
            # 这条门禁的价值在于「别再进来新的」，以及把已存在的暴露出来。
            # 误报按值的形状放行（.gitleaks.toml），历史残留按指纹放行（.gitleaksignore），
            # 两者都要求逐条写理由。
            - name: 密钥扫描（全历史）
              run: gitleaks git --no-banner --redact
            # 工作流自身的静态检查。装了 shellcheck 时会一并查 run: 里的内联 bash
            # （mise.toml 钉了 shellcheck，所以这条在哪都一样严）。
            - name: 工作流静态检查
              run: actionlint
            # 工作流安全审计。--offline 是刻意的：在线模式（--pedantic/联网查
            # known-vulnerable-actions、impostor-commit）在本仓库实测与离线**结果相同**，
            # 却要一个 token 且结果随上游变动——门禁要确定性。
            - name: 工作流安全审计
              run: zizmor --offline .github/workflows
            # 文档链接。markdown 里的相对路径 / 跨文档引用 / 锚点坏掉是**静默**的：
            # 文件改名后链接文字照旧显示，只有点下去才知道 404；而 AGENTS.md 与 docs/
            # 是 AI 读的上下文，引用断了不报错，只会让上下文悄悄少一块。
            # 配置在 lychee.toml：offline（只验本地、不联网，代价是外部 URL 一律不查）、
            # include_fragments（标题改名导致的坏锚点也能查出来）、extensions = ["md"]。
            # 为什么没有参数：配置全在 lychee.toml 里，命令行保持无参数就不会两处漂移。
            - name: 文档链接
              run: lychee .
            # monorepo 一致性：同一个依赖在不同包里版本不一致、空依赖字段、
            # 依赖没按字母序、workspace 通配符指向不存在的目录等。
            # 与 pnpm 的 catalogMode: strict 是**两侧**：那管 `pnpm add` 的写入，
            # 手改 package.json 塞显式版本它拦不住，这一格正由 sherif 补上。
            # failOnWarnings 开在 package.json 的 sherif 字段里（同一份配置本机钩子也用）。
            - name: monorepo 一致性
              run: sherif
            # 依赖漏洞。扫的是「锁文件 / pom」，不是 node_modules——
            # 这样 CI 不必装依赖就能跑，也才能覆盖后端 Maven 那一半。
            # 忽略清单在 osv-scanner.toml（逐条带理由与到期日），必须显式 --config：
            # 实测放在工作目录并不会被自动发现。
            # 放在本 job 最后：它要联网拉 deps.dev 的依赖图与漏洞库（实测 ~3.5 分钟），
            # 是这里唯一慢且依赖上游可用性的一步；前面几条都是亚秒级。
            - name: 依赖漏洞（前端锁文件）
              run: osv-scanner scan source --lockfile=pnpm-lock.yaml --config=osv-scanner.toml
            - name: 依赖漏洞（后端 Maven）
              run: osv-scanner scan source --lockfile=apps/server/pom.xml --config=osv-scanner.toml

    db-migrations:
        name: 数据库迁移 lint（squawk）
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # 增量基线要 origin/main（或 PR 的 GITHUB_BASE_REF）算 merge-base；
                  # 默认浅克隆只拉当前 ref，origin/main 不存在会让脚本「无基线」而误判「无改动」跳过，
                  # 等于放危险迁移进主干。fetch-depth: 0 与 security / frontend 的 fallow audit 同口径。
                  fetch-depth: 0
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: "24"
                  cache: true
                  run-install: false
            - run: vp install --frozen-lockfile
            # 增量只查「相对基线新增 / 改动的迁移」，拦「非并发建索引 / NOT NULL 无默认 / 加列锁表」这类停机事故。
            # 历史已上生产的迁移不可变、全量查只会永久红，故只查增量（基线由脚本内算：GITHUB_BASE_REF→origin/main→跳过）。
            # 无基线 / 无改动时脚本优雅跳过（exit 0），不会把「没动迁移」的 PR 判红。静态分析不需要数据库。
            - name: 迁移 lint
              run: pnpm db:migrations:lint

    frontend:
        name: 前端 lint / typecheck / 死代码
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # fallow audit 要拿 PR 基准分支算 merge-base，浅克隆没有这段历史
                  fetch-depth: 0
            # setup-vp 一次装好 vp + Node + pnpm + 依赖缓存。vp 版本按 package.json/lockfile 自动解析，
            # pnpm 版本取 lockfile 里记的那份（packageManagerDependencies），不再手抄版本号
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: "24"
                  cache: true
                  run-install: false
            - run: vp install --frozen-lockfile
            # 与 lefthook pre-push 同一条 check：包含 fmt / lint，不带 --fix，不改工作区。
            - name: check
              run: pnpm exec vp check
            # 先判生成物漂移再 typecheck：资源改了却没重新生成时，这条报错比 tsc 里一堆类型对不上好读
            - name: i18n
              run: pnpm i18n:drift
            # 同一条理由：错误码注册表（openapi/error-codes.mjs）改了而 Java / TS 两份常量没跟上，
            # 这里拦住。码拼错编译照样过，要到运行时才炸，所以漂移必须早一步红
            - name: error-codes
              run: pnpm errors:drift
            # 与 pre-push 同一道门：包含表单约束 schemas.gen.ts，生成物不许落后于契约。
            - name: sdk-drift
              run: pnpm sdk:drift
            # 复用本 job 的工具链和依赖，不为轻量审计再起一台 runner。
            - name: contract-audit
              run: pnpm contract:audit
            - name: typecheck
              run: pnpm typecheck
            # github-annotations：发现直接标在 PR diff 对应行上
            - name: dead-code
              run: pnpm fallow --format github-annotations
            # 生产视角：测试/脚本之外没人用的导出，只被测试引用却放在 dependencies 的依赖
            - name: dead-code (production)
              run: pnpm fallow:production --format github-annotations
            # 只在 PR 上跑：push 到 main 时没有可比的基准分支
            # base_ref 走环境变量再引用：分支名允许 shell 元字符，直接内插进 run 会被求值
            - name: audit
              if: github.event_name == 'pull_request'
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: pnpm exec fallow audit --base "origin/$BASE_REF" --format github-annotations
            # 产物体积预算。放最后：它要构建三端（~10s，是本 job 里最贵的一步），
            # 而它失败的概率最低——真失败时前面那些便宜的门早该拦住了。
            # 口径见 scripts/perf-bundle.mjs：量的是 gzip 字节，与 perf/bundle-baseline.json 比，
            # 首屏 JS 超预算即红。这一项没有测量噪声，所以它是本项目第一个该设成门禁的性能指标。
            - name: bundle-budget
              run: pnpm perf:bundle:check

    frontend-test:
        name: 前端单测（与 checks 并行）
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # 独立 job、无 needs：与上面的 frontend 同时起跑，checks 和 test 不再串行叠加。
            # 代价是 install 跑两遍，但 setup-vp 的依赖缓存命中后第二份很便宜，wall-clock 净降。
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: "24"
                  cache: true
                  run-install: false
            - run: vp install --frozen-lockfile
            - name: test
              run: pnpm test

    frontend-i18n:
        name: 三端 i18n 浏览器验收（生产构建）
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: "24"
                  cache: true
                  run-install: false
            - run: vp install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm typecheck:e2e
            # 独立配置无造数、不连数据面；业务 API 在浏览器网络层隔离。
            - run: pnpm test:e2e:i18n
            - name: 上传语言验收失败现场
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: i18n-browser-diagnostics
                  path: e2e/test-results/i18n
                  if-no-files-found: ignore

    backend:
        name: 后端 verify（Java 25）
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # *Test 里的接口测试跑的是全量上下文（WebControllerTestSupport 刻意不 exclude 数据源，
        # 见其类注释），要连 shop_test 并由 Flyway 从零跑全量迁移建库，所以快环也必须有 PG。
        # 副作用是好的：迁移链能否在干净 PG 18 上从零跑通，从此每次 push 都验一遍。
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop_dev
                    POSTGRES_DB: shop_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U shop -d shop_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            # Spotless 未绑定 Maven 生命周期，必须显式校验；CI 不运行 spotless:apply。
            - name: format
              run: mvn -B -ntp -f apps/server/pom.xml spotless:check -q
            # verify 覆盖 *Test 与 *IT：真实 PG/Redis、Flyway 全量迁移、事务后事件和模块边界都在门禁内。
            - name: verify
              run: mvn -B -ntp -f apps/server/pom.xml verify -q
              env:
                  # 仓库默认 15432 是 Windows 侧端口占用换来的本地口径（见 application.yml），CI 的 service 在 5432
                  SHOP_DB_PORT: "5432"
            - name: 上传后端失败报告
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: backend-diagnostics
                  path: |
                      apps/server/target/surefire-reports
                      apps/server/target/failsafe-reports
                  if-no-files-found: ignore

    e2e:
        name: Playwright 下单与发货物流链路
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop_dev
                    POSTGRES_DB: shop
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U shop -d shop"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
              with:
                  node-version: "24"
                  cache: true
                  run-install: false
            - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            # 后端这条链最慢（编译 + Spring 上下文 + Flyway 全量迁移，实测 ~50s），所以先放出去，
            # 让它和装 psql / 装依赖 / 装浏览器并行；就绪统一在后面「等待三处就绪」收口。
            # 改前那一步「启动并等就绪」59s，改后就绪只剩 16s（实测同一 commit 前后两轮）。
            # 后台进程跨步骤存活（Actions 只在 job 结束才收摊），这里不需要 hold 住 shell。
            - name: 拉起后端（不等待）
              env:
                  SHOP_DB_PORT: "5432"
              run: mvn -f apps/server/pom.xml spring-boot:run > /tmp/shop-server.log 2>&1 &
            - run: sudo apt-get update && sudo apt-get install -y postgresql-client
            - run: vp install --frozen-lockfile
            - name: 拉起 web / 卖家工作台（不等待）
              run: |
                  pnpm --filter web dev > /tmp/shop-web.log 2>&1 &
                  pnpm --filter seller dev > /tmp/shop-seller.log 2>&1 &
            - run: pnpm exec playwright install --with-deps chromium
            - name: 等待三处就绪
              timeout-minutes: 3
              run: |
                  deadline=$((SECONDS + 120))
                  while (( SECONDS < deadline )); do
                    if curl -sf --max-time 5 http://localhost:8080/v3/api-docs >/dev/null && curl -sf --max-time 5 http://localhost:3000 >/dev/null && curl -sf --max-time 5 http://localhost:5000 >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  cat /tmp/shop-server.log
                  cat /tmp/shop-web.log
                  cat /tmp/shop-seller.log
                  exit 1
            - name: 运营数据健康扫描
              run: pnpm health:scan
              env:
                  SHOP_DB_PORT: "5432"
            # 造数由 e2e/globalSetup 走接口完成（每轮现注册卖家+开店+审核+商品+下单），
            # 所以这里不再灌 seed:demo——测试不许依赖演示库残留，跑在干净迁移库上才是真话
            - name: 运行下单主路径与发货物流链路
              id: playwright
              run: pnpm test:e2e
              env:
                  E2E_SELLER_URL: http://localhost:5000
                  SHOP_DB_PORT: "5432"
            - name: 上传 Playwright 报告
              if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: playwright-report
                  path: e2e/playwright-report
                  if-no-files-found: error
            # 失败现场：trace/video/screenshot + 那轮造数清单（照它能直接用接口重放出同样的数据）
            - name: 上传失败诊断材料
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-diagnostics
                  path: |
                      e2e/test-results
                      e2e/.fixture/run.json
                  # 清单在隐藏目录里；只收指定文件，不上传 .auth 等其他隐藏目录。
                  include-hidden-files: true
                  if-no-files-found: ignore
            - name: 上传服务日志
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: e2e-service-logs
                  path: /tmp/shop-*.log
                  if-no-files-found: ignore
