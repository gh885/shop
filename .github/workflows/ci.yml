name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    frontend:
        name: 前端 lint / typecheck / 单测 / 死代码
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # fallow audit 要拿 PR 基准分支算 merge-base，浅克隆没有这段历史
                  fetch-depth: 0
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # 与 lefthook pre-push 同一套命令（不带 --fix：push 前只校验，不改工作区）
            - name: lint
              run: pnpm oxlint --config packages/config/oxlint.config.ts .
            - name: typecheck
              run: pnpm typecheck
            # github-annotations：发现直接标在 PR diff 对应行上
            - name: dead-code
              run: pnpm fallow --format github-annotations
            # 生产视角：测试/脚本之外没人用的导出，只被测试引用却放在 dependencies 的依赖
            - name: dead-code (production)
              run: pnpm fallow:production --format github-annotations
            # 只在 PR 上跑：push 到 main 时没有可比的基准分支
            - name: audit
              if: github.event_name == 'pull_request'
              run: pnpm exec fallow audit --base origin/${{ github.base_ref }} --format github-annotations
            - name: test
              run: pnpm test

    backend:
        name: 后端 verify（Java 25）
        runs-on: ubuntu-latest
        # *Test 里的接口测试跑的是全量上下文（WebControllerTestSupport 刻意不 exclude 数据源，
        # 见其类注释），要连 shop_test 并由 Flyway 从零跑全量迁移建库，所以快环也必须有 PG。
        # 副作用是好的：迁移链能否在干净 PG 18 上从零跑通，从此每次 push 都验一遍。
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop_dev
                    POSTGRES_DB: shop_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U shop -d shop_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            # verify 覆盖 *Test 与 *IT：真实 PG/Redis、Flyway 全量迁移、事务后事件和模块边界都在门禁内。
            - name: verify
              run: mvn -f apps/server/pom.xml verify -q
              env:
                  # 仓库默认 15432 是 Windows 侧端口占用换来的本地口径（见 application.yml），CI 的 service 在 5432
                  SHOP_DB_PORT: "5432"

    e2e:
        name: Playwright 下单与发货物流链路
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: shop
                    POSTGRES_PASSWORD: shop_dev
                    POSTGRES_DB: shop
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U shop -d shop"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
            redis:
                image: redis:7
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - run: sudo apt-get update && sudo apt-get install -y postgresql-client
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chromium
            - name: 启动后端与 web / 卖家工作台
              env:
                  SHOP_DB_PORT: "5432"
              run: |
                  mvn -f apps/server/pom.xml spring-boot:run > /tmp/shop-server.log 2>&1 &
                  pnpm --filter web dev > /tmp/shop-web.log 2>&1 &
                  pnpm --filter seller dev > /tmp/shop-seller.log 2>&1 &
                  for i in $(seq 1 60); do
                    if curl -sf http://localhost:8080/v3/api-docs >/dev/null && curl -sf http://localhost:3000 >/dev/null && curl -sf http://localhost:5000 >/dev/null; then
                      exit 0
                    fi
                    sleep 2
                  done
                  cat /tmp/shop-server.log
                  cat /tmp/shop-web.log
                  cat /tmp/shop-seller.log
                  exit 1
            - name: 运营数据健康扫描
              run: pnpm health:scan
              env:
                  SHOP_DB_PORT: "5432"
            # 造数由 e2e/globalSetup 走接口完成（每轮现注册卖家+开店+审核+商品+下单），
            # 所以这里不再灌 seed:demo——测试不许依赖演示库残留，跑在干净迁移库上才是真话
            - name: 运行下单主路径与发货物流链路
              run: pnpm test:e2e
              env:
                  E2E_SELLER_URL: http://localhost:5000
                  SHOP_DB_PORT: "5432"
            - name: 上传 Playwright 报告
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: e2e/playwright-report
                  if-no-files-found: ignore
            # 失败现场：trace/video/screenshot + 那轮造数清单（照它能直接用接口重放出同样的数据）
            - name: 上传失败诊断材料
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-diagnostics
                  path: |
                      e2e/test-results
                      e2e/.fixture
                  if-no-files-found: ignore

    contract:
        name: SDK 契约一致性
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 12.4.1
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: node scripts/contract-audit.mjs
