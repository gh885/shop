- group: 验证码（短信 / 图形）
  code: SMS_RATE_LIMIT
  status: 429
  behavior: 按码分支：提示失败文案，并同样起 60s 重发倒计时（共享 LoginForm 的发码分支：发码成功、或失败命中此码，都进倒计时）
  trigger: 同一 IP 或手机号频繁请求验证码
- group: 验证码（短信 / 图形）
  code: SMS_DAILY_LIMIT
  status: 429
  behavior: 不按码分支：429 经全局错误通道 toast 展示 catalog「今日验证码已达上限」
  trigger: 同一手机号当日发送量超日限（20 条）
- group: 验证码（短信 / 图形）
  code: SMS_CODE_EXPIRED
  status: 400
  behavior: 按码分支：提示「验证码已失效，请重新获取」，由用户手动重新发码；无自动重取流程
  trigger: 登录或重置密码的验证码超时，或输错满 5 次被当场作废
  notes: 计数上限 5 次（SmsCodeService）：第 5 次输错当场焚码，但当次响应仍是 SMS_CODE_INVALID；之后再输才因无哈希报本码。重新发码会清尝试计数。
- group: 验证码（短信 / 图形）
  code: SMS_CODE_INVALID
  status: 400
  behavior: 按码分支：输入框标红，提示「验证码错误」
  trigger: 登录或重置密码的验证码比对不通过
- group: 验证码（短信 / 图形）
  code: CAPTCHA_REQUIRED
  status: 400
  behavior: 按码分支：提示「请先完成图形验证码」，刷新验证码图
  trigger: 发码请求未携带 captchaId / captchaCode
  notes: 两字段在 DTO 里必填，缺失或空白在 422 就被拦住、到不了这里；本码是带的 captchaId 在服务端查不到答案（/auth/sms-code、/auth/forgot-password）。
- group: 验证码（短信 / 图形）
  code: CAPTCHA_EXPIRED
  status: 400
  behavior: 按码分支：提示「图形验证码已过期」，自动刷新验证码图并让用户重输
  trigger: 图形验证码超时（5 分钟）或已被消费
- group: 验证码（短信 / 图形）
  code: CAPTCHA_INVALID
  status: 400
  behavior: 按码分支：输入框标红，提示「图形验证码错误」，刷新验证码图
  trigger: 图形验证码比对不通过（输错或大小写不符）
- group: 令牌与会话
  code: TOKEN_EXPIRED
  status: 401
  behavior: 按码分支：只有带 TOKEN_EXPIRED 或 INVALID_TOKEN 的 401 才进「刷新 → 重放」（sdk-client 的 isTokenVerdict），其余 401 直接冒泡；刷不动才降级为未登录
  trigger: JWT access token 超过有效期
  notes: 买家 10 分钟 / 员工 8 小时（application.yml）。前端静默续期的触发条件之一。
- group: 令牌与会话
  code: INVALID_TOKEN
  status: 401
  behavior: 按码分支：与 TOKEN_EXPIRED 同一格（同进刷新重放）——两者在客户端动作上仍无可分辨，分开只为诊断
  trigger: 未携带 token、格式无效、类型/受众错误或签名校验失败
  notes: 「未携带 token」也归这个码：否则请求抢在 bootstrapAuth 之前发出时，客户端无从判断「该刷一次」，只能放弃。
- group: 令牌与会话
  code: REFRESH_TOKEN_REUSED
  status: 410
  behavior: 按码分支：refresh 拦截器命中此码时 tokenStore.clear() 清登录态，410 原样冒泡由全局通道 toast 展示 catalog「所有设备已下线」
  trigger: Refresh token 被重放，该主体全部设备会话已吊销
  notes: 15s 并发宽限期（RefreshTokenStore）：已消费的 token 在宽限期内再被消费判为多标签页竞争，返回 401 且无 code——那一发不是本码，前端别按重放处理。
- group: 账号与权限
  code: USER_DISABLED
  status: 403
  behavior: 不按码分支：toast 展示 catalog「账号已被禁用，如需恢复请联系平台客服」；下单被拦时无额外动作
  trigger: 买家状态非 ACTIVE
  notes: 登录/刷新，及下单闸门 OrderService.create 经 account::api 查状态。
- group: 账号与权限
  code: STAFF_DISABLED
  status: 403
  behavior: 不按码分支：toast 展示 catalog「员工账号已被禁用，请联系平台管理员」
  trigger: 平台员工状态非 ACTIVE
  notes: 平台员工登录时（StaffService.login）。
- group: 账号与权限
  code: SUBACCOUNT_NOT_ACTIVATED
  status: 403
  behavior: 按码分支：卖家端登录页切到子账号激活步骤（填本人手机号 + 验证码），不走「登录失败」提示
  trigger: 子账号还没验过本人手机号就来登口令
  notes: SubaccountService.login。激活步骤里「登录名或手机号不正确」是另一个码位（400，无 code）——那一发不区分「登录名不存在」与「号码不对」，防这个匿名端点被当成登录名枚举器。
- group: 账号与权限
  code: PERMISSION_DENIED
  status: 403
  behavior: 不按码分支：与其它 403 同一条通道（toast 展示 catalog「没有执行该操作的权限」）；「无权限页」并没有实现，也不引导登录
  trigger: 已认证主体缺少接口所需权限码
  notes: PermissionInterceptor 判权失败。
- group: 账号与权限
  code: PHONE_ALREADY_REGISTERED
  status: 409
  behavior: 按码分支：注册页把手机号输入框标红，提示「这个手机号已经注册过了」，并给一个「去登录」的链接
  trigger: 买家注册时手机号已存在（撞 uq_buyer_phone）
  notes: 与登录失败刻意不同口径——登录不区分「没这个号」和「密码不对」（匿名接口区分等于送一个手机号枚举器），注册必须区分，否则用户不知道自己该换号还是该去登录。
- group: 店铺
  code: SHOP_NAME_TAKEN
  status: 400
  behavior: 不按码分支：开店/改名表单的 zod 只管长度，撞名由全局通道 toast catalog「店名已被使用，请换一个」；字段不标红（后端这一发不带 errors）
  trigger: 店名已被全平台任一店铺占用
  notes: ShopService.createShop 预检；并发撞 uk_shops_name 唯一索引兜成同一 400，不看店铺状态。
- group: 店铺
  code: SHOP_LIMIT_EXCEEDED
  status: 400
  behavior: 不按码分支：toast 展示 catalog「每人最多开 1 家店铺」；开店入口没有据此置灰
  trigger: 一人一店：已持有 OWNER 成员记录
  notes: shop.shop_members 里已 >=1 条 OWNER；被拒/被封店铺仍计数，子账号同闸。
- group: 交易
  code: INSUFFICIENT_STOCK
  status: 409
  behavior: 不按码分支：不点名具体 SKU，toast 展示 catalog「商品库存不足」，用户自行改数量/移除商品后重新结算
  trigger: 预览后商品被抢空，条件扣减库存影响行数为 0
- group: 交易
  code: COUPON_ALREADY_CLAIMED
  status: 409
  behavior: 按码分支：按钮置为「已领取」并提示，不引导重试
  trigger: 同一用户重复领取同一张券
  notes: 每人每模板限领 1 张，唯一索引兜底。
- group: 类目挂载闸门
  code: CATEGORY_NOT_LEAF
  status: 400
  behavior: 不按码分支：toast 显示 catalog「请选择三级类目」；发品/编辑页类选择器引导改选三级类目
  trigger: 商品只能挂载到叶子类目（三级）
  notes: 创建商品或草稿改挂类目时，目标类目 level != 3（CatalogPublishService.requireCategory）。类目深度定死三层，level 就是判据，is_leaf 已删。
- group: 类目挂载闸门
  code: CATEGORY_DISABLED
  status: 400
  behavior: 不按码分支：toast 显示 catalog「该类目或其上级类目已禁用，请另选类目」；引导改选启用类目
  trigger: 目标类目或父链任一祖先禁用
  notes: 与公开树「父级不可见整支剪掉」同口径。
- group: 类目挂载闸门
  code: BRAND_REQUIRED
  status: 400
  behavior: 不按码分支：品牌选择器标红，提示「该类目必须选择品牌」
  trigger: 类目要求选品牌，但请求没给
  notes: 类目 brand_policy = required 且 brandId 为空（CatalogPublishService.checkBrandPolicy）。
- group: 类目挂载闸门
  code: BRAND_FORBIDDEN
  status: 400
  behavior: 不按码分支：品牌选择器置灰并提示「该类目不允许选择品牌」
  trigger: 类目不允许选品牌，但请求给了
  notes: 类目 brand_policy = forbidden 且 brandId 非空。
- group: 规格编辑闸门
  code: DUPLICATE_SKU_SPEC
  status: 409
  behavior: 按码分支：读 errors 的 field 标红规格选择区，提示「规格组合重复」
  trigger: 同一 SPU 下两个 SKU 规格组合相同
  notes: 服务端按 attributeId 排序拼 spec_key 后去重（CatalogPublishService.createDraft）；并发窗口由 uq_sku_spec 兜底。
- group: 类目配置闸门
  code: CATEGORY_CONFIG_INCOMPLETE
  status: 400
  behavior: 不按码分支：toast 显示「类目配置未配齐，请补齐属性模板与识别键」
  trigger: 类目配置不完整，不能转 active
  notes: 缺属性模板、识别键为空、或 brand_policy 与属性模板冲突（CatalogConfigService.activate）。
- group: 类目配置闸门
  code: CATEGORY_LEVEL_EXCEEDED
  status: 400
  behavior: 不按码分支：新增按钮在三级类目上置灰，服务端兜底
  trigger: 类目层级超过三层
  notes: 类目深度定死三层（CatalogConfigService.create）。
- group: 类目配置闸门
  code: CATEGORY_CODE_TAKEN
  status: 409
  behavior: 按码分支：code 输入框标红，提示「这个类目编码已被占用」
  trigger: 类目 code 已存在
  notes: code 对外稳定且不可变，ERP 和开放平台拿它对接（uq_category_code）。
- group: 类目配置闸门
  code: ATTRIBUTE_CODE_TAKEN
  status: 409
  behavior: 按码分支：属性 code 输入框标红
  trigger: 属性 code 在该类目下已存在
  notes: uq_attribute_code (category_id, code)。
- group: 类目配置闸门
  code: IDENTITY_ATTRIBUTE_NEEDS_DOMAIN
  status: 400
  behavior: 不按码分支：属性表单里 is_identity 勾选时把 value_type 限制在 enum / number
  trigger: 识别属性必须是枚举或数字
  notes: 自由文本进参数哈希，同款归并直接失效（product-model.md §2.2.5）。
- group: 规格编辑闸门
  code: SPEC_SELECTION_EMPTY
  status: 400
  behavior: 不按码分支：toast 显示 catalog「请为该规格至少选择一个取值，或填写自定义取值」
  trigger: 某规格条目的 valueIds 与 customValues 都为空
  notes: SkuService.resolveSelections 逐条判（原 SpecSelectionRequest 的 @AssertTrue 升格为码：跨字段「至少其一」约束 rule 词表表达不了，且这句话独一份，归 code 不归 rule）。
- group: 地址条数闸门
  code: ADDRESS_LIMIT_EXCEEDED
  status: 400
  behavior: 不按码分支：toast 显示 catalog（两种语言同一句式），上限数字由 params.limit 填——后端把 20 改成 30 时这句跟着变，前端零改动；参数缺失时退回按 locale 的兜底，不印裸槽位
  trigger: 买家新增收货地址时未删地址已达上限
  notes: 上限 20 条（AddressService.create；软删不占名额）。数字走参数通道，不写死进文案。
- group: 地址条数闸门
  code: MERCHANT_ADDRESS_LIMIT_EXCEEDED
  status: 400
  behavior: 不按码分支：toast 显示 catalog（上限数字由 params.limit 填，与买家端同一条通道）；参数缺失时退回按 locale 的兜底
  trigger: 商家本店未删地址已达上限
  notes: 上限 200 条（MerchantAddressService.create）。
- group: 运营位
  code: BANNER_TIME_RANGE_INVALID
  status: 400
  behavior: 不按码分支：两个输入框标红发生在提交前的 zod（banner/form.ts 的 refine），能漏到后端这一发就是 toast catalog「结束时间必须晚于开始时间」
  trigger: banner 失效时间不晚于生效时间
  notes: 含 update 时与库中原窗口合并后的两端（ContentService.createBanner / updateBanner）。
- group: 内容合规
  code: FORBIDDEN_WORD_HIT
  status: 400
  behavior: 按码分支：读 errors 的 field/value 就地定位到出问题的字段（标题/卖点）并标红，命中词嵌进当前语种的那句（卖家端 product.publish.forbiddenWordHit）。拿不到字段级明细时才退成全局 toast
  trigger: 公开文本命中违禁词（COM-01）
  notes: 状态码 400 不足以让前端定位到哪个字段该标红，所以这个码有真实消费方：apps/seller/src/product/forbidden-word.ts，而不是只弹一个全局 toast。出口在 ProductService.ensurePublishable 与 updateBasic（非草稿改标题或卖点）；评价与售后凭证文本 P2 复用同一出口。
- group: 交易
  code: PRICE_CHANGED
  status: 409
  behavior: 按码分支：结算页弹出「价格已变化」并展示新报价，用户确认后才重新提交；不静默用新价，也绝不按旧价成交
  trigger: 落单时 fingerprint 与当前购物车快照对不上（商品、数量、地址、规则版本任一变了）
  notes: 结算页显示 99、扣款 109 是投诉里最难解释的一类，所以这一发必须让用户看见。出口在 pricing 的 consumeQuote；携带新 quoteId 由前端重新确认。
- group: 交易
  code: QUOTE_EXPIRED
  status: 409
  behavior: 按码分支：与 PRICE_CHANGED 同一格（都是「重新算一次再确认」），文案换成「报价已过期，请重新确认」
  trigger: 落单时报价单已过 expires_at，或已被别的请求用掉（status 不再是 issued）
  notes: 与 PRICE_CHANGED 分开是因为两件事的原因不同：一个是价变了，一个是这张报价没了。查问题时差别很大。
- group: 交易
  code: SHIPPING_TEMPLATE_MISSING
  status: 409
  behavior: 按码分支：结算页把这家店标成「暂不支持配送」并提示移出该店商品；不弹通用错误，也不让用户反复重试
  trigger: 算价时店铺没有启用中的运费模板（seller.shipping_template 无 active 行）
  notes: 买家没做错任何事，所以不能是 400——那是「请求参数错」。选 409 是因为它是「当前状态不允许这次算价」，且运营能据此告警去补配置。出口在 pricing 的 QuoteCalculator.computeShipping。
- group: 履约
  code: TRACKING_NO_REUSED
  status: 409
  behavior: 按码分支：把运单号输入框标红，提示「这个运单号已经用过了」，让商家核对是不是手误录了两遍
  trigger: 同一个运单号已经挂在别的包裹上（撞 uq_package_tracking）
  notes: 不拦的话，买家会收到两个一样的包裹，而账上两笔都算已发货。
- group: 运营配置
  code: CONFIG_ARCHIVED
  status: 409
  behavior: 按码分支：把这条配置标成「已归档」并刷新列表，提示「已归档的配置不能再改，需要调整请新建一条」；不重试、不弹通用错误
  trigger: 修改或再次启用的配置 status 已经是 archived（运费模板、促销规则共用）
  notes: 单看 409 分不出「归档了」和「名字重复」——前者该刷新列表，后者该标红输入框，所以这个码有真实消费方。出口在 seller 的 ShippingTemplateService 与 promotion 的 PromotionAdminService。
- group: 幂等
  code: IDEMPOTENCY_IN_PROGRESS
  status: 409
  behavior: 按码分支：延时后原样重试（同键 + 同 Idempotency-Key），不是弹通用错误——首个请求还在处理中，稍后重试会拿到它的结果
  trigger: 带同一 Idempotency-Key 的请求已到达且尚未记录结果（Redis 处理锁被占）时又来一个同键请求
  notes: 只包资金类写操作（pay / 商家确认退款 / 挂账退款）。出口在 infra 的 Idempotency.execute。
- group: 购物车
  code: CART_SKU_NOT_SELLABLE
  status: 400
  behavior: 按码分支：toast 展示 catalog「商品已下架或停售」，稍后刷新页面；不重试
  trigger: 加购时 catalog 判定该 SKU 当前不可售（下架 / 停售 / 已删）
  notes: 并入（merge）不走本码——失效商品照收进车、列表页置灰，加购闸门只拦「现在就想买」。唯一抛出点在 cart 的 CartService.add。
- group: 购物车
  code: CART_FULL
  status: 400
  behavior: 不按码分支：400 经全局错误通道 toast 展示 catalog「购物车最多存放 120 种商品」
  trigger: 加购新增条目种类时车内种类数已达上限
  notes: 同 SKU 累加不新增种类，不受它拦。上限由 params 通道传 limit，后端改 120 时不改前端文案。
