# 权限码唯一真相源。
#
# 生成的产物（`pnpm permissions:gen`，不要手改）：
#   1. 后端 `infra.security.Permission` 枚举
#   2. `packages/common/src/contract/permission-codes.ts` 的常量与联合类型
# 漂移由 `pnpm permissions:drift`（生成物过期）与后端 `PermissionVocabularyTest` 拦。
#
# 为什么源在文件里而不是数据库里：一次改名/重构时，DB 为真相源意味着代码里每个检查点都是字符串
# 字面量，编译器一个都不提示；而 DB 侧一行 UPDATE 就完事。**必须被写下来的是"在哪里检查这个码"**，
# 检查点不可替代，"库里有哪些码"可以由检查点完整重建。让可重建的东西当源，方向是反的。
#
# 结构是「资源 → 动作」，不是扁平列表：动作是**资源局部**的，不是一张全局动词表。
# 扁平列表表达不了"这是这个资源的全部动作"，也就无法校验"某个资源是否少了一个"。
#
# ── 字段 ────────────────────────────────────────────────────────────────────
# resources[].name        资源名。**必须是可数名词**——能指着一条记录说"这个 ___ 是谁的"。
#                         领域名（售后）、流程名（治理/审计/运维）一律不行。
# resources[].scope       商家侧求值方式：shop（授权店集合）/ merchant（本商家，推导）/
#                         none（无范围，平台级）。
#                         平台主体无视这一列——平台不在任何租户里，范围恒为全平台。
#                         没有"资源行 buyer_id"这种范围：买家不持码，他的边界是列绑定，不走授权。
# actions[].name          动词，不许带宾语。`refund` ✅；`approve_refund` ❌
#                         ——宾语重复说明你要的其实是 `approve`，或者你要操作的东西本身就是资源。
# actions[].pool          **哪些主体池能持有这个码**，是集合不是排他域：
#                           merchant  只有商家主体能持有（owner 与子账号）
#                           platform  只有平台员工能持有
#                           both      两侧都能（同一个码，不是两个码——否则必然漂移）
#                         这一列是"主账号拥有一切商家权限"的推导依据：owner 的集合 =
#                         `pool` 含 merchant 的全部码。它**不限制**谁可以持有——它只回答
#                         "这个码在那个池里有没有意义"。
# actions[].risk          high = 一次操作能改变别人的钱 / 改变全平台可见状态 / 封停账号 / 管钥匙。
# actions[].assignable    商家能不能把这个码授给子账号。默认 false。
#                         **和 risk 不是一回事**：`after_sale_case:refund` 动的是商家自己的钱，
#                         所以 high 但可转授（配退款上限）；`merchant_staff:write` 与 `shop:close`
#                         永不可转授——一个是钥匙可以复印，一个是不可逆。
#
# ── 每资源最多 5 个动作 ──────────────────────────────────────────────────────
# 超过就说明它该拆。这条比"一页纸"更好用，因为它能在设计时立刻报警。
#
# 买家侧没有权限码：买家的边界是"这条数据是不是我的"，靠 buyer_id 列绑定表达，不是靠授权。

version: 1

resources:
    # ── 订单链 ────────────────────────────────────────────────────────────────
    - name: order
      label: 订单
      scope: shop
      actions:
          - { name: read, label: 读订单, pool: both, assignable: true }

    - name: after_sale_case
      label: 售后单
      scope: shop
      actions:
          - {
                name: handle,
                label: 处理售后（拒绝、留言、举证，不动钱）,
                pool: merchant,
                assignable: true,
            }
          - {
                name: refund,
                label: 同意退款（动钱，受角色退款上限约束）,
                pool: merchant,
                risk: high,
                assignable: true,
            }

    - name: package
      label: 包裹
      scope: shop
      actions:
          - { name: read, label: 读包裹与轨迹, pool: both, assignable: true }
          - { name: ship, label: 发货, pool: merchant, assignable: true }
          - { name: track, label: 人工补录物流轨迹, pool: platform, risk: high }

    # ── 商品与库存 ────────────────────────────────────────────────────────────
    - name: product
      label: 商品
      scope: shop
      actions:
          - { name: read, label: 读商品, pool: both, assignable: true }
          - { name: write, label: 商品建、改、上下架, pool: merchant, assignable: true }
          - { name: review, label: 商品审核（通过 / 驳回）, pool: platform }

    - name: inventory
      label: 库存
      scope: shop
      actions:
          - { name: read, label: 读库存与库存流水, pool: merchant, assignable: true }
          - { name: adjust, label: 调整可售库存, pool: merchant, assignable: true }

    - name: category
      label: 类目
      scope: none
      actions:
          - { name: configure, label: 类目树的建、改、移动、归档, pool: platform }

    - name: brand
      label: 品牌
      scope: none
      actions:
          - { name: configure, label: 品牌库的建、改、归档, pool: platform }

    # ── 店铺与账号 ────────────────────────────────────────────────────────────
    - name: shop
      label: 店铺
      scope: merchant
      actions:
          - {
                name: update,
                label: 改店铺资料（读自己店不判权，平台读店是 review 的一部分）,
                pool: merchant,
                assignable: true,
            }
          - { name: close, label: 关闭店铺（不可逆）, pool: merchant, risk: high }
          - { name: review, label: 入驻审核（通过 / 驳回）, pool: platform }
          - { name: suspend, label: 暂停 / 恢复经营, pool: platform, risk: high }

    - name: merchant_staff
      label: 商家子账号
      scope: merchant
      actions:
          - { name: write, label: 管理子账号、角色与授权, pool: merchant, risk: high }

    - name: settlement
      label: 结算单
      scope: shop
      actions:
          - {
                name: read,
                label: 读结算单与账单（放款由平台或系统触发）,
                pool: both,
                assignable: true,
            }

    - name: shipping_template
      label: 运费模板
      scope: shop
      actions:
          - {
                name: configure,
                label: 运费模板的建、改、启用、归档,
                pool: merchant,
                assignable: true,
            }

    # ── 营销 ──────────────────────────────────────────────────────────────────
    - name: coupon
      label: 优惠券
      scope: none
      actions:
          - { name: configure, label: 建券、改券模板, pool: platform }
          - { name: issue, label: 发放优惠券（立即产生负债）, pool: platform, risk: high }

    - name: promotion_rule
      label: 促销规则
      scope: none
      actions:
          - { name: configure, label: 建、改促销规则（草稿态）, pool: platform }
          - {
                name: activate,
                label: 上线 / 下线规则（改所有买家看到的价格）,
                pool: platform,
                risk: high,
            }

    - name: ad
      label: 广告
      scope: shop
      actions:
          - { name: read, label: 读广告位与投放数据, pool: both, assignable: true }
          - { name: write, label: 建、改广告投放, pool: merchant, assignable: true }
          - { name: review, label: 广告审核, pool: platform }

    # ── 内容与治理 ────────────────────────────────────────────────────────────
    - name: content_article
      label: 内容文章
      scope: none
      actions:
          - { name: write, label: 建、改、发布内容, pool: platform }

    - name: governance_clue
      label: 治理线索
      scope: none
      actions:
          - { name: read, label: 读违规线索, pool: platform }

    # ── 平台账号与资金 ────────────────────────────────────────────────────────
    - name: buyer_account
      label: 买家账号
      scope: none
      actions:
          - { name: read, label: 读买家资料, pool: platform }
          - { name: suspend, label: 封禁 / 解封买家, pool: platform, risk: high }

    - name: platform_staff
      label: 平台员工
      scope: none
      actions:
          - { name: write, label: 平台员工的建、调岗、禁用, pool: platform, risk: high }

    - name: suspense
      label: 挂账单
      scope: none
      actions:
          - { name: read, label: 读挂账清单, pool: platform }
          - { name: refund, label: 挂账原路退款（动真钱）, pool: platform, risk: high }
          - { name: reject, label: 驳回挂账, pool: platform }

    - name: reconciliation_statement
      label: 对账单
      scope: none
      actions:
          - { name: read, label: 读对账结果与资金结构, pool: platform }

    # ── 运维与审计 ────────────────────────────────────────────────────────────
    - name: job
      label: 定时任务
      scope: none
      actions:
          - { name: trigger, label: 手动触发定时任务, pool: platform }

    - name: event_record
      label: 事件登记
      scope: none
      actions:
          - { name: read, label: 读未完成的事件登记, pool: platform }
          - {
                name: replay,
                label: 事件重放（让已被判死的事件重新生效）,
                pool: platform,
                risk: high,
            }

    - name: audit_log
      label: 审计日志
      scope: none
      actions:
          - { name: read, label: 读审计日志, pool: platform }

    - name: rum_report
      label: 前端监控报告
      scope: none
      actions:
          - { name: read, label: 读 RUM 采集与告警面板, pool: platform }

# ── 平台岗位 → 权限码 ────────────────────────────────────────────────────────
# **从代码推导，不进库。** 与 SUPER_ADMIN、商家主账号同一口径：一个"什么都有的角色"
# 不该是一份需要有人记得同步的种子行——漏同步是静默失权，删表是全体失权。
# 集成测试的 TRUNCATE 就是这么把它揪出来的：库里有、表被清了，岗位就零权限。
#
# SUPER_ADMIN 不在这里：它的集合恒等于清单全集（`Permission.codes()`）。
staff_roles:
    REVIEWER: [shop:review, shop:suspend, audit_log:read]
    OPS:
        - category:configure
        - content_article:write
        - package:track
        - coupon:configure
        - audit_log:read
        - rum_report:read
        - shop:suspend
