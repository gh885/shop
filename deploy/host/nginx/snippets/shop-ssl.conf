# TLS 公共配置。__LIVE_DIR__ 由 setup-host.sh 渲染成 /etc/letsencrypt/live/<证书名>/。
ssl_certificate     __LIVE_DIR__fullchain.pem;
ssl_certificate_key __LIVE_DIR__privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_timeout 1d;
ssl_session_cache shared:shopSSL:5m;
ssl_session_tickets off;
