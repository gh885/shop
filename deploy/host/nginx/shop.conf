# shop 三端站点（无域名阶段：同一公网 IP，按端口分站）。
# setup-host.sh 渲染占位符后装到 /etc/nginx/sites-available/shop；证书是 Let's Encrypt 的 IP 证书
# （6 天短期，certbot 定时器自动续，deploy-hook 里 reload nginx）。
#
# 路由口径与各端 vite.config.ts 的 proxy 清单保持一致——改那边的前缀表，这里同步改：
#   web    /auth /api /user /payments /favorites /coupons/ /reviews → 后端；/orders /cart 按 Accept 分流
#   seller /auth /shops /seller /api → 后端
#   admin  /admin → 后端
# 后端与 SSR 容器只绑 127.0.0.1（见 deploy/app/compose.yml），对外只有这三个 server。

upstream shop_server { server 127.0.0.1:18080; keepalive 16; }
upstream shop_web    { server 127.0.0.1:13000; keepalive 16; }

# 页面与 API 共用路径（/orders/$id 既是买家页面也是 GET /orders/{id}）：文档导航带 text/html 的
# Accept，SDK 请求不带——与 apps/web/vite.config.ts 的 pageApiProxy 同一判据。
map "$request_method:$http_accept" $shop_shared_upstream {
    default                        shop_server;
    "~^(GET|HEAD):.*text/html"     shop_web;
}

# ---------------- 买家端 web：443 ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    include snippets/shop-ssl.conf;
    include snippets/shop-security-headers.conf;
    client_max_body_size 10m;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 图片：对象存储测试域名只有 http，https 页面直接引会被浏览器按混合内容拦掉，经本机转一道。
    # 三端的 VITE_IMAGE_BASE_URL 都指向这里（https://<ip>/img）。
    location /img/ {
        proxy_pass __IMAGE_ORIGIN__/;
        proxy_set_header Host __IMAGE_HOST__;
        proxy_hide_header Set-Cookie;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include snippets/shop-security-headers.conf;
    }

    # API 前缀 → 后端
    location ~ ^/(auth|api|user|payments|favorites|reviews)(/|$) {
        proxy_pass http://shop_server;
        include snippets/shop-proxy.conf;
    }
    location ^~ /coupons/ {
        proxy_pass http://shop_server;
        include snippets/shop-proxy.conf;
    }
    # 页面与 API 共用前缀：按 Accept 分流（见上方 map）
    location ~ ^/(orders|cart)(/|$) {
        proxy_pass http://$shop_shared_upstream;
        include snippets/shop-proxy.conf;
    }

    # 构建产物（带 hash 文件名）由 SSR 容器的 srvx 提供（它会做 brotli），这里只补长缓存。
    location ^~ /assets/ {
        proxy_pass http://shop_web;
        include snippets/shop-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/shop-security-headers.conf;
    }

    location / {
        proxy_pass http://shop_web;
        include snippets/shop-proxy.conf;
    }
}

# ---------------- 卖家端 seller：8443（纯静态 SPA）----------------
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name _;
    include snippets/shop-ssl.conf;
    include snippets/shop-security-headers.conf;
    client_max_body_size 10m;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/shop/current/seller;
    index index.html;

    location ~ ^/(auth|shops|seller|api)(/|$) {
        proxy_pass http://shop_server;
        include snippets/shop-proxy.conf;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/shop-security-headers.conf;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include snippets/shop-security-headers.conf;
    }
}

# ---------------- 平台端 admin：9443（纯静态 SPA）----------------
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name _;
    include snippets/shop-ssl.conf;
    include snippets/shop-security-headers.conf;
    client_max_body_size 10m;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/shop/current/admin;
    index index.html;

    location ^~ /admin {
        proxy_pass http://shop_server;
        include snippets/shop-proxy.conf;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/shop-security-headers.conf;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include snippets/shop-security-headers.conf;
    }
}
