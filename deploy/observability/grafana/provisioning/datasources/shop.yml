# Grafana 数据源（provisioning，启动即生效，不用点 UI）。
#
# uid 必须写死：看板 JSON 里的 datasource.uid 按它引用。Grafana 在没写 uid 时会按名字生成
# 随机 uid，导入的看板就全变成 "datasource not found" —— 一片 No data 且看不出原因。
apiVersion: 1

datasources:
    - name: shop-prometheus
      uid: shop-prometheus
      type: prometheus
      access: proxy
      # Prometheus 与 Grafana 同在 WSL 里，走容器网络名不合适（本机栈没有编排），
      # 由 scripts/obs-stack.mjs 注入 SHOP_OBS_PROM_URL。
      url: $SHOP_OBS_PROM_URL
      isDefault: true
      editable: false
      jsonData:
          # 对齐 prometheus.local.yml 的 scrape_interval：Grafana 的 step 默认是 scrape_interval，
          # 这里写死是为了面板查询不被默认步长悄悄聚合掉
          timeInterval: 15s
          httpMethod: POST
          prometheusType: Prometheus
          prometheusVersion: 3.15.0
