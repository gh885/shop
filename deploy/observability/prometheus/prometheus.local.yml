# 本机最小采集栈的 Prometheus 配置（无 Docker，进程跑在 WSL Ubuntu 里）。
#
# 与 prometheus.yml.example 的区别只有两处，都是「本机」决定的：
#   1. target 是 127.0.0.1:8080 —— 后端跑在 Windows 上，靠 WSL2 镜像网络（networkingMode=mirrored）
#      的 localhost 共享被够到；容器编排下才需要 shop-server:8080 这种服务名。
#   2. retention 压到 7d：本机是看趋势，不是长期留存。
#
# 启动：`pnpm obs:up`（脚本会 cd 到本文件所在目录再 exec —— rule_files 是相对**工作目录**解析的，
# 这里用相对路径 `shop-alerts.yml` 才不用把 D:\Code\projects\shop 硬编码进配置）。
# 全量参数见 deploy/observability/README.md。

global:
    scrape_interval: 15s
    evaluation_interval: 15s
    external_labels:
        monitor: shop-local

rule_files:
    - shop-alerts.yml

scrape_configs:
    - job_name: shop-server
      metrics_path: /actuator/prometheus
      # 本机：后端在 Windows 上。不带 scheme 时 Prometheus 默认补 http。
      static_configs:
          - targets:
                - 127.0.0.1:8080
                # 后端没起时把这一行留着当靶子也无所谓，但默认不放 —— 多一个 down 目标只会
                # 让人在看板上一开始就以为坏了。起了后端再打开。
                # - 127.0.0.1:8081
