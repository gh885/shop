# osv-scanner 忽略清单 —— **前端（pnpm-lock）扫描专用**（放行必须逐条写理由 + 到期日，到期会被重新报出来）。
#
# 判据：**上游无修复版**且**漏洞路径不可达**，两条都成立才写这里。
# 「上游有修复版」的一律去升依赖，不写这里——写这里等于把能修的东西挂起来。
# 「传递引入但自己用不到」的优先去 pom 里 `<exclusion>` 掉，也不写这里。
#
# 当前条目：1 条（braces，npm）。后端 Maven 侧另见 osv-scanner.maven.toml。
#
# 为什么按生态拆两份：CI 两条扫描（前端 pnpm-lock / 后端 pom）若共用一份 config，
# 某一生态专有的 ignore（如这条 npm 的 braces）在另一生态那次必被 osv-scanner 判「没用上」而 exit 1。
# 保留这个文件是因为前端扫描显式带 `--config=osv-scanner.toml`（配置发现按扫描根走，
# 自动发现够不到仓库根，见 docs/conventions/tooling.md），上面这段判据也需要一个落点。
#
# 参考样例（已不再需要，留作「首选修法」的示范）：
#   okhttp 3.14.4 / okio 1.17.2 由 com.qiniu:qiniu-java-sdk:7.19.0 传递引入，
#   GHSA-3cqm-mf7h-prrj / GHSA-w33c-445m-f8w7，上游无修复版。曾按「运行时不可达」放行，
#   后改在 apps/server/pom.xml 的该依赖上 `<exclusion>` 掉 okhttp（okio 只由它传递引入，
#   随之消失），两条 IgnoredVulns 已删。回归护栏：QiniuClientTest 用真实 Auth 签一张凭证。

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = """
braces 3.0.3 由 micromatch 4.0.8 传递引入，而 micromatch 被 eslint-plugin-boundaries@7.2.0
与 @boundaries/elements@3.1.1 逐字钉死（两处都写 "micromatch": "4.0.8"），override 顶不动它、
也就顶不动它的 braces。上游无修复版：OSV 记 last_affected=3.0.3（即全部现有版本都受影响），
micromatch/braces#70 尚未合入，没有可升的目标。
不可达的依据：braces 只被 micromatch 用于展开 glob 模式，本仓库喂给它的是 .fallowrc.json 与
packages/config/oxlint.config.ts 里写死的模式串，全部来自仓库自身、无外部可控输入；该 CVE 是
「深度嵌套模式导致栈耗尽」的 DoS，没有不受信输入就没有触发面。
到期复查上游是否发布 3.0.4；发布了就升掉并删除本条。
"""
ignoreUntil = 2026-11-15
