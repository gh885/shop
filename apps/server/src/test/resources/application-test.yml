# 集成测试专用库：与 dev 库隔离，测试数据再泄漏也脏不到开发数据。
# 注意：本文件不继承主配置的 spring.datasource.url，必须显式指向 shop_test。
spring:
    datasource:
        url: jdbc:postgresql://127.0.0.1:${SHOP_DB_PORT:15432}/shop_test
        username: shop
        password: shop_dev

    flyway:
        enabled: true
        # 测试库同样全量跑种子：CategoryAttrIT / ProductIT 断言的是 V43 模板里的必填参数（attr 430103），
        # 从零迁移出来的库必须有它，否则「建草稿必带屏幕尺寸」这类用例无从构造
        locations: classpath:db/migration,classpath:db/seed
        # 测试库从零全量迁移（V1→最新），不继承主配置的 baseline-version:10
        baseline-on-migrate: false
        # 钉死默认 schema：用户名与模块 schema 同名（shop），PG 的 "$user" search_path 会把
        # current_schema 解析成 shop schema，导致 Flyway 去那里找历史表而误判“无历史表”
        default-schema: public

    jackson:
        deserialization:
            fail-on-unknown-properties: true

    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true
    global-config:
        db-config:
            id-type: AUTO

shop:
    # 测试上下文关掉读缓存：一是这些用例不该需要 Redis，二是缓存会把「写完立刻读」的断言变成读到旧值，
    # 串到下一个用例上。缓存自身的语义由 infra/cache/ReadCacheTest 那类专项用例用内存缓存器验。
    cache:
        enabled: false
