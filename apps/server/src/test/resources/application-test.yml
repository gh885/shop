spring:
    datasource:
        # 连接串由 Testcontainers 的 @ServiceConnection 接线（testsupport/IntegrationTest），
        # 这里只留 Hikari 行为参数。
        hikari:
            # 并发发号测试要打 2000 次 commit，每次 fsync 在 Docker 卷上约 15ms，关上后降到 1ms 级。
            # 只影响「崩溃时最后几个事务可能丢」，测试不关心这个；开发库仍保持默认的同步提交。
            connection-init-sql: "SET synchronous_commit = off"
    data:
        redis:
            # host/port 由 Testcontainers 接线；database 15 与容器内其它数据隔开：
            # 限流计数是跨请求累加的，不隔离的话测试连跑几轮就会撞上「同 IP 10 次/分钟」的
            # 登录限流，变成随缘红。键必须在 spring 下（与主配置的 spring.data.redis 同键）：
            # 之前误挂在 shop. 下，Spring 静默忽略未知键，隔离从未生效。
            database: 15

shop:
    auth:
        jwt:
            # 测试专用密钥，不是任何环境的真实凭证；只用来让测试里的令牌能签能验。
            secret: test-only-signing-key-not-used-anywhere-else-32b
            issuer: shop-test
    actuator:
        # .env 里本地把指标口打开了；测试要验「默认是关的」，所以这里显式压回去。
        metrics-public: false
    api-docs:
        # 同上：.env 里本地把接口文档口打开了；测试要验「默认是关的」，这里显式压回去。
        public: false
    event:
        retry:
            # 测试默认关掉后台补发，免得别的测试被后台任务干扰；补发自己有专门的测试打开它。
            enabled: false
    payment:
        # 测试必须用 mock 渠道：本地 .env 里可能配了 ALIPAY，那样测试会真的去打渠道。
        # 这里显式压回 mock。
        channel: mock
    security:
        # 测试专用 pepper（>=32 字符）：不是任何环境的真实凭证
        pepper: test-only-pepper-not-used-anywhere-else-32768
