# 生产 profile：所有秘密与环境差异项一律环境变量注入，占位符无默认值——漏配即启动失败。
# 变量清单见 apps/server/.env.example；本地开发不走本文件（默认 profile 自带 dev 默认值）。

spring:
    application:
        # 日志信封：version 要能定位到一次构建（git sha），否则事后分不清故障是哪次发布带来的；
        # env 不接环境变量——prod profile 只有这一个取值；不写就落到 RequestIdFilter 的默认值 dev
        version: ${SHOP_VERSION}
        env: prod

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

    data:
        redis:
            host: ${SPRING_DATA_REDIS_HOST}
            port: ${SPRING_DATA_REDIS_PORT:6379}
            # Redis 有密码时必填；无密码实例请显式留空并确认网络隔离
            password: ${SPRING_DATA_REDIS_PASSWORD:}

    flyway:
        # 生产库非空且历史表可能缺失的场景已在 dev 阶段消化；生产首次接管已有库时人工评估 baseline
        baseline-on-migrate: false
        # 演示种子（db/seed：类目属性模板全量重建 + 五个旗舰店的商品）不进生产——
        # 那两条脚本带 TRUNCATE，且会把 picsum 占位商品灌进真店。类目属性模板由运营在管理端配置。
        locations: classpath:db/migration

shop:
    rum:
        # **生产整条遥测链路是关的（2026-10）**。理由不是「暂时没配好」，是一次**必然全丢**：
        # 加工链上游那层 Kafka broker 要单独一台机器，而 2026-10 那台 2C/1.6G 主机实测
        # 可用内存 782M、swap 已用 490M，塞不下一个 JVM（判断与 ADR 0005 同源）。
        # 不关的症状最差：浏览器照发、接收端照回 204、投递指向不存在的 localhost:9092——
        # 页面毫无感觉，只有 shop.rum.publish.failed 一路涨，而那条线没人配告警。
        # 关掉之后门口就拦下，**一个假信号都不产生**。
        #
        # 一个开关管两头（接收端 + 消费端），翻的时候一起翻：只开接收端会得到「投递必失败」，
        # 只开消费端会得到「没有 broker 时 @KafkaListener 一直重连、警告灌满日志」。
        # 有了 broker 之后把 SHOP_RUM_ENABLED 设成 true + 重启即可，**前端一个字不用改**
        # （上报本来就没停过，只是被门口丢掉了）。
        enabled: ${SHOP_RUM_ENABLED:false}
        consumer-enabled: ${SHOP_RUM_ENABLED:false}

    web:
        # 仅当部署在会覆写 X-Forwarded-For 的可信反代（nginx 等）之后才设 true，
        # 否则 IP 限流可被伪造头绕过
        trust-forwarded-for: ${SHOP_WEB_TRUST_FORWARDED_FOR}
        # CORS 允许来源，逗号分隔的完整来源（含协议与端口，如 https://shop.example.com）。
        # 无默认值——漏配即启动失败，好过带着 localhost 白名单上线后全站跨域失败。
        # 前后端同源部署（反代同一域名）时 CORS 不参与，填站点自身域名即可
        cors-allowed-origins: ${SHOP_WEB_CORS_ALLOWED_ORIGINS}

    auth:
        # 短信通道：生产禁止 dev（固定码 666666 后门）。接入真实 SmsChannel 实现后再上线；
        # 未实现真实通道时该占位符会导致 DevSmsChannel 不装配——发码接口启动即失败而非静默降级
        sms-channel: ${SHOP_AUTH_SMS_CHANNEL}
        # 图形验证码：生产写死非 dev 值，DevCaptchaChannel 不装配——那道门就是给人机对抗用的，
        # 没有「生产也放行固定码」的第二种取值，所以这里不接环境变量（接了反而多一个误配成 dev 的口子）
        captcha-channel: real
        # refresh cookie 的共享父域（如 .example.com）：web/seller 同域共享会话实现轻量单点登录。
        # 必须与前端域的父域一致；留空则各站独立会话（不自动登录）
        refresh-cookie-domain: ${SHOP_AUTH_REFRESH_COOKIE_DOMAIN}
        # 单 IP 每日可发验证码的不同手机号数上限。CGNAT / 公司出口 / 校园网下大量真实用户
        # 共享同一出口 IP，按实际出口 IP 分布调整；调低会误伤正常注册
        sms-ip-distinct-phones-max: ${SHOP_AUTH_SMS_IP_DISTINCT_PHONES_MAX:30}

    security:
        # HMAC pepper：openssl rand -hex 32 生成；泄露 = 验证码/refresh token 可被离线伪造。
        # 与 DB 凭证同等保密等级，轮换会使全体在途 refresh token 失效（用户需重新登录）
        pepper: ${SHOP_SECURITY_PEPPER}

    jwt:
        # ES256 密钥对（PKCS#8 / X.509 base64）：生产必须固定——重启 token 不失效、多实例共享验签。
        # 生成：openssl ecparam -name prime256v1 -genkey | openssl pkcs8 -topk8 -nocrypt ...
        private-key: ${SHOP_JWT_PRIVATE_KEY}
        public-key: ${SHOP_JWT_PUBLIC_KEY}

logging:
    file:
        name: ${SHOP_LOG_FILE:/var/log/shop/shop-server.log}
