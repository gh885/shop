<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <title>Shop API 文档</title>
    </head>
    <body>
        <!-- Scalar 单文件文档页。读同源的 /v3/api-docs（永远与运行中的后端一致），不读仓库快照
             openapi/api-docs.json——那份是给 sdk:gen 的，两次导出之间会过时。
             UI 本体走 CDN、零 npm 依赖；离线时页面空白属预期。免登录开关见 shop.api-docs.public。 -->
        <script
            id="api-reference"
            data-url="/v3/api-docs"
            data-configuration='{"theme":"purple","layout":"modern"}'
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    </body>
</html>
