server:
    port: ${SERVER_PORT:8080}

spring:
    config:
        # 本地开发读 apps/server/.env（gitignored）；部署环境没有这个文件就忽略。
        import: "optional:file:./.env[.properties]"
    application:
        name: shop-server
    datasource:
        # 本地数据面由 compose.dev.yml 提供，PG 映射到 15432
        url: jdbc:postgresql://${SHOP_DB_HOST:127.0.0.1}:${SHOP_DB_PORT:15432}/shop
        username: ${SHOP_DB_USER:shop}
        password: ${SHOP_DB_PASSWORD:shop}
    data:
        redis:
            host: ${SHOP_REDIS_HOST:127.0.0.1}
            port: ${SHOP_REDIS_PORT:6379}
    flyway:
        # 建表只走迁移脚本，不用 ddl-auto。脚本按模块分文件，见 docs/domain/module-map.md
        enabled: true
        locations: classpath:db/migration
        # 必须显式指定：不写的话 Flyway 拿 JDBC 连接的 search_path 首项（也就是用户名 shop）当默认 schema，
        # 会在库里凭空建出一个 shop schema 并把历史表塞进去。历史表跟基础设施表一起住 common。
        default-schema: common
        schemas: common
        create-schemas: true
    task:
        scheduling:
            pool:
                # 默认是 1：对账/结算这种全库聚合一慢，事件补发和三个超时兜底就在同一条队列里排队。
                # 4 个线程装下全部 7 个任务还有余量。
                size: 4
    modulith:
        events:
            jdbc:
                # 表由迁移脚本建（V20261020221000），不让库自己建：库只在 test/embedded 场景自动建，
                # 而且永远建在 public，跟我们的 schema 约定对不上。关掉后由 Flyway 负责。
                schema-initialization:
                    enabled: false
    jackson:
        deserialization:
            fail-on-unknown-properties: true

shop:
    auth:
        jwt:
            # 密钥没有默认值：默认密钥进仓库等于所有人共用一把锁。
            # 本地放 apps/server/.env（gitignored），部署走平台环境变量。少于 32 字节启动直接失败。
            secret: ${SHOP_JWT_SECRET:}
            issuer: ${SHOP_JWT_ISSUER:shop}
            # access 令牌有效期。刷新令牌还没做，所以这里给 2 小时；做完刷新应缩到 15 分钟。
            access-ttl: ${SHOP_JWT_ACCESS_TTL:2h}
    event:
        retry:
            # 补发任务：监听器失败或进程崩溃后，把没完成的事件重新投一遍。见 infra/event/EventRetryJob。
            enabled: true
            interval: PT30S
            # 只捡发布超过这么久的。太新的可能正在跑，抢过来就是重复消费。
            min-age: PT1M
            batch-size: 100
            max-in-flight: 10
            # 超过这个次数不再自动重试，留给人工；指标里能看见。
            max-attempts: 10
            # 超过这么久还没完成就打 WARN。这是整条事件链路唯一值得盯的数字。
            stuck-after: PT5M
    actuator:
        # 指标口是否免登录。默认关（fail-closed）：本地靠 apps/server/.env 打开，生产没有那个文件所以自动关。
        # 生产要抓指标走内网或带凭证——指标里有流量形态和内部名字。
        metrics-public: ${SHOP_METRICS_PUBLIC:false}
    seed:
        # 只有显式设了这个变量才会建本地种子账号（研发本地专用，生产不设）。见 LocalAccountSeed。
        password: ${SHOP_SEED_PASSWORD:}
    payment:
        # 渠道：mock（本地，不发真请求） / alipay。
        # 选了 alipay 就必须配齐下面的 app-id / public-key / gateway-url，缺一个启动直接失败——
        # 不让"以为接了支付宝其实没接"这种状态存在。见 PaymentChannelConfig。
        channel: ${SHOP_PAYMENT_CHANNEL:mock}
        alipay:
            app-id: ${SHOP_PAYMENT_ALIPAY_APP_ID:}
            # 渠道公钥，用来验回调签名。带不带 PEM 头都认。私钥不进这里。
            public-key: ${SHOP_PAYMENT_ALIPAY_PUBLIC_KEY:}
            gateway-url: ${SHOP_PAYMENT_ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
            # 异步回调。必须是公网可达的 https 地址，否则沙箱永远回调不进来
            notify-url: ${SHOP_PAYMENT_ALIPAY_NOTIFY_URL:}
            # 买家付完被带回的前端页面
            return-url: ${SHOP_PAYMENT_ALIPAY_RETURN_URL:http://localhost:3000/pay/return}
        refund-retry:
            # 渠道没受理的退款单定时重试。没有它，一次渠道抖动就把售后单永久卡在 refunding。
            enabled: true
            interval: PT5M
            # 只捞创建超过这么久的 pending：刚失败的还在同步路径的手掌心里
            min-age: PT5M
            # 超过这个次数不再自动重试，留在 pending 等人工；日志里能看见
            max-attempts: 10

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus
    endpoint:
        health:
            # 本地要能一眼看到 db / redis 各自状态
            show-details: always

logging:
    level:
        root: INFO
        org.springframework: WARN
