server:
    port: ${SERVER_PORT:8080}

spring:
    config:
        # 本地开发读 apps/server/.env（gitignored）；部署环境没有这个文件就忽略。
        import: "optional:file:./.env[.properties]"
    application:
        name: shop-server
    datasource:
        # 本地数据面由 compose.dev.yml 提供，PG 映射到 15432
        # socketTimeout（秒）：任何一条 SQL 或网络挂起最多拖 30 秒。调度线程和 JobLock
        # 在任务全程押着的连接不会被一个病态查询无限期占住；迁移 DDL 都是亚秒级，不受影响。
        url: jdbc:postgresql://${SHOP_DB_HOST:127.0.0.1}:${SHOP_DB_PORT:15432}/shop?socketTimeout=30
        username: ${SHOP_DB_USER:shop}
        password: ${SHOP_DB_PASSWORD:shop}
    data:
        redis:
            host: ${SHOP_REDIS_HOST:127.0.0.1}
            port: ${SHOP_REDIS_PORT:6379}
    flyway:
        # 建表只走迁移脚本，不用 ddl-auto。脚本按模块分文件，见 docs/domain/module-map.md
        enabled: true
        locations: classpath:db/migration
        # 必须显式指定：不写的话 Flyway 拿 JDBC 连接的 search_path 首项（也就是用户名 shop）当默认 schema，
        # 会在库里凭空建出一个 shop schema 并把历史表塞进去。历史表跟基础设施表一起住 common。
        default-schema: common
        schemas: common
        create-schemas: true
    task:
        scheduling:
            pool:
                # 默认是 1：对账/结算这种全库聚合一慢，事件补发和超时兜底就在同一条队列里排队。
                # 全部 11 个任务（8 个 fixedDelay 兜底 + 3 个凌晨 cron 错峰）都是秒级批量，
                # 4 个线程仍有余量。注意：若开 spring.threads.virtual.enabled（默认关，
                # 已在 4.1.2 的配置元数据里核实），Boot 会改用 SimpleAsyncTaskScheduler，此项失效。
                size: 4
    modulith:
        events:
            jdbc:
                # 表由迁移脚本建（V20261020221000），不让库自己建：库只在 test/embedded 场景自动建，
                # 而且永远建在 public，跟我们的 schema 约定对不上。关掉后由 Flyway 负责。
                schema-initialization:
                    enabled: false
    jackson:
        deserialization:
            fail-on-unknown-properties: true

shop:
    auth:
        jwt:
            # 密钥没有默认值：默认密钥进仓库等于所有人共用一把锁。
            # 本地放 apps/server/.env（gitignored），部署走平台环境变量。少于 32 字节启动直接失败。
            secret: ${SHOP_JWT_SECRET:}
            issuer: ${SHOP_JWT_ISSUER:shop}
            # access 令牌有效期。续期走刷新令牌轮换（httpOnly cookie，一次一换），
            # access 被盗的窗口就是它：给短，15 分钟。
            access-ttl: ${SHOP_JWT_ACCESS_TTL:15m}
        # 短信通道。dev = 打日志 + 固定码 666666 + 虚拟收件箱（/api/dev/sms-inbox）；
        # 生产不配真实通道实现时启动即失败——短信登录没有通道就不能开。
        sms-channel: ${SHOP_SMS_CHANNEL:dev}
        # 图形验证码通道。dev = 固定码 DEVOK 直通（本地联调/E2E 用）；生产不配 = 恒要求真实作答。
        captcha-channel: ${SHOP_CAPTCHA_CHANNEL:dev}
        account:
            # 休眠判定窗口（天）：这么久没活跃且有密码的账号不再吃短信通道（登录/找回都不放行）。
            # 号码回收后新机主凭短信码接管旧账号是真实攻击面。0 = 关闭该闸门。
            dormant-login-days: ${SHOP_DORMANT_LOGIN_DAYS:90}
            # 单 IP 每日不同手机号上限：挡「一个 IP 横扫大量号码」的短信轰炸。
            sms-ip-distinct-phones-max: ${SHOP_SMS_IP_PHONES_MAX:50}
            # 自助注销冷静期（天）：申请后可撤销，期满由扫描器匿名化。
            deletion-cooling-off-days: ${SHOP_DELETION_COOLING_OFF_DAYS:14}
        deletion-sweep:
            # 到期注销申请的扫描执行。关掉只影响「申请生效」，不影响申请/撤销本身。
            enabled: true
    security:
        # HMAC pepper：短信验证码 / refresh token 落 Redis 前的摘要密钥（openssl rand -hex 32）。
        # 未配置时启动生成临时值并告警——重启后在途验证码与 refresh token 全部失效，仅限开发环境。
        pepper: ${SHOP_SECURITY_PEPPER:}
    event:
        retry:
            # 补发任务：监听器失败或进程崩溃后，把没完成的事件重新投一遍。见 infra/event/EventRetryJob。
            enabled: true
            interval: PT30S
            # 只捡发布超过这么久的。太新的可能正在跑，抢过来就是重复消费。
            min-age: PT1M
            batch-size: 100
            max-in-flight: 10
            # 超过这个次数不再自动重试，留给人工；指标里能看见。
            max-attempts: 10
            # 超过这么久还没完成就打 WARN。这是整条事件链路唯一值得盯的数字。
            stuck-after: PT5M
        cleanup:
            # 已完成事件登记 + 消费去重记录的清理。只删已完成的，未完成的留给补发任务。
            enabled: true
            cron: "0 10 3 * * *"
            # 保留期盖住重投窗口（分钟级）就安全
            retention: P7D
    pricing:
        cleanup:
            # 报价证据清理：全库写入量最大的表族，证据只留 30 天
            enabled: true
            cron: "0 20 3 * * *"
            retention: P30D
    actuator:
        # 指标口是否免登录。默认关（fail-closed）：本地靠 apps/server/.env 打开，生产没有那个文件所以自动关。
        # 生产要抓指标走内网或带凭证——指标里有流量形态和内部名字。
        metrics-public: ${SHOP_METRICS_PUBLIC:false}
    seed:
        # 只有显式设了这个变量才会建本地种子账号（研发本地专用，生产不设）。见 LocalAccountSeed。
        password: ${SHOP_SEED_PASSWORD:}
    payment:
        # 渠道：mock（本地，不发真请求） / alipay。
        # 选了 alipay 就必须配齐下面的 app-id / public-key / gateway-url，缺一个启动直接失败——
        # 不让"以为接了支付宝其实没接"这种状态存在。见 PaymentChannelConfig。
        channel: ${SHOP_PAYMENT_CHANNEL:mock}
        alipay:
            app-id: ${SHOP_PAYMENT_ALIPAY_APP_ID:}
            # 渠道公钥，用来验回调签名。带不带 PEM 头都认。私钥不进这里。
            public-key: ${SHOP_PAYMENT_ALIPAY_PUBLIC_KEY:}
            gateway-url: ${SHOP_PAYMENT_ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
            # 异步回调。必须是公网可达的 https 地址，否则沙箱永远回调不进来
            notify-url: ${SHOP_PAYMENT_ALIPAY_NOTIFY_URL:}
            # 买家付完被带回的前端页面
            return-url: ${SHOP_PAYMENT_ALIPAY_RETURN_URL:http://localhost:3000/pay/return}
        refund-retry:
            # 渠道没受理的退款单定时重试。没有它，一次渠道抖动就把售后单永久卡在 refunding。
            enabled: true
            interval: PT5M
            # 只捞创建超过这么久的 pending：刚失败的还在同步路径的手掌心里
            min-age: PT5M
            # 超过这个次数不再自动重试，留在 pending 等人工；日志里能看见
            max-attempts: 10

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus
    endpoint:
        health:
            # 本地要能一眼看到 db / redis 各自状态
            show-details: always

logging:
    level:
        root: INFO
        org.springframework: WARN
