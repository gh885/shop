server:
    port: ${SERVER_PORT:8080}

spring:
    config:
        # 本地开发读 apps/server/.env（gitignored，见 .env.example 说明）；部署环境无此文件则忽略（optional）。
        # Spring 工作目录 = apps/server（spring-boot-maven-plugin basedir，见 pom），故 ./ 指向 apps/server/.env
        import: "optional:file:./.env[.properties]"
    application:
        name: shop-server
        version: 0.0.1-SNAPSHOT
        env: dev

    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}

    datasource:
        url: jdbc:postgresql://127.0.0.1:5432/shop
        username: shop
        password: shop_dev
        hikari:
            # JacksonTypeHandler 用 setString 写 JSON；未指定类型时让 PostgreSQL 按目标 jsonb 列推断。
            data-source-properties:
                stringtype: unspecified

    flyway:
        enabled: true
        # db/seed 不是 schema 迁移而是演示数据装载（V43 类目属性模板全量重建、V44 演示商品，都带 TRUNCATE）：
        # 留在迁移目录里 = 每个新建库（CI、生产首发、测试库）都被迫吃一遍「五个旗舰店 + picsum 图」。
        # dev 与 test（IT 断言依赖 V43 模板行）加载它，prod 覆盖成只读 db/migration。
        locations: classpath:db/migration,classpath:db/seed
        baseline-on-migrate: true
        # 库结构已到 V10 但历史表丢失时，按当前版本基线，避免重放旧迁移失败（V4 DROP IDENTITY）
        baseline-version: 10
        # 不加载 db/seed 的环境里 V43/V44 成了「已应用但本地没有文件」，validate 要放过
        ignore-missing-migrations: true
        # 建索引要能 CONCURRENTLY（见 V65）：它不能进事务，而默认 true 时 Flyway 用两条连接——
        # 迁移跑在第二条上，第一条上未提交的 schema history 事务成了它等待的目标，启动直接自锁挂死。
        # false 让 Flyway 复用单连接并按迁移切换 autoCommit，普通迁移照旧各自一个事务。
        postgresql:
            transactional-lock: false

    jackson:
        deserialization:
            fail-on-unknown-properties: true

    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

    modulith:
        events:
            # 事件登记表补发：重启后自动重投未完成的 AFTER_COMMIT 登记（崩溃窗口兑底）
            republish-outstanding-events-on-restart: true
            # 消费成功即删除登记行；未完成/失败行仍保留并由 EventPublicationRecoveryJob 重投
            completion-mode: delete
            jdbc:
                # 登记表结构归 Flyway 管（V22__kernel_event_publication.sql），关掉框架自带初始化
                schema-initialization:
                    enabled: false
                # 跨模块基建表，与 distributed_locks 同居 kernel schema（见 V1/V22）
                schema: kernel

# OpenAPI：Java enum 以 $ref 组件 schema 输出（而非内联字面量），前端 openapi-ts 才能生成命名 enum 常量。
# 开关不在配置里，而是各 enum 类上的 @Schema(enumAsRef = true)（springdoc 无全局属性）

# 运维端点：健康检查（DB+Redis 自动探测）与 Prometheus 抓取；JwtProperties.skipPaths 已放行 /actuator。
# 生产部署时需在网关层限制 /actuator/prometheus 的来源。
management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

logging:
    # 控制台：人读格式 + 全链路 trace_id + ANSI 着色。
    # 注意 %clr 用圆括号 (…) 包裹（Spring Boot 官方写法），不是花括号——嵌套的 %d{}/%logger{} 自带花括号，用花括号会解析错乱。
    pattern:
        console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%thread]){faint} %clr([%X{trace_id}]){magenta} %clr(%logger{40}){cyan} %clr(-){faint} %m%n"
    level:
        root: INFO
        # 压框架启动噪音，业务日志（com.shop.platform）保持 INFO 可读
        org.springframework: WARN
        org.apache.catalina: WARN
    structured:
        format:
            # 文件输出 ECS JSON（可解析、可进日志系统）；控制台走上面的可读 pattern
            file: ecs
    file:
        name: logs/shop-server.log

mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true

shop:
    cache:
        # 配置类读数据（首页三块 / 类目树与子树 / 店铺公开信息）的 Redis 读缓存，名单与 TTL 见
        # infra/cache。关掉只是排障或测试用的开关：写侧失效已接在每条后台写上，生产没有关的理由
        enabled: true
    web:
        # 客户端 IP 取法：默认只信 TCP 对端地址（remoteAddr）。仅当部署在会覆写
        # X-Forwarded-For 的可信反向代理（nginx 等）之后才改 true，否则 IP 限流可被伪造头绕过
        trust-forwarded-for: false
        # CORS 允许来源。本地开发前端走 Vite proxy 同源，CORS 其实不参与；
        # 这份默认值是给「直连后端调试」用的。生产必须覆盖成真实域名（见 application-prod.yml）
        cors-allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:4000,http://localhost:5000"
    security:
        # 服务端 pepper：HMAC-SHA256 密钥，验证码 / refresh token 落 Redis 前的脱敏密钥。
        # 生产必须显式配置（openssl rand -hex 32）；未配置则启动时生成临时值——
        # 重启后在途验证码与 refresh token 全部失效，仅限开发环境
        # pepper: "${SHOP_SECURITY_PEPPER}"
    auth:
        # 短信通道：dev = 验证码打日志 + 固定码 666666，仅限本地开发。
        # 未配置时 DevSmsChannel 不装配——生产接入真实通道实现（实现 SmsChannel 接口）后换掉此值
        sms-channel: dev
        # 图形验证码：dev = 固定码 DEV4 直通校验（见 DevCaptchaChannel），仅供 E2E 与本地联调注册账号。
        # 图照常生成、缺参照旧 400，只有「比对答案」这一步免掉；生产必须显式给非 dev 值
        captcha-channel: dev
        # refresh cookie 的 Domain。留空 = 不设 domain（本地 localhost，web/seller 同 host 已天然共享）；
        # 生产设成共享父域（如 .example.com）后买家端与卖家端共用会话，登录一处另一处自动登录
        refresh-cookie-domain: ""
    jwt:
        # ES256 密钥对（PKCS#8 / X.509 base64），不配置则启动时自动生成临时密钥对
        # private-key: "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg..."
        # public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE..."
        access-token-expiration: 600000
        staff-access-token-expiration: 28800000
        refresh-token-expiration: 604800000
    # 物流承运商接入（快递鸟聚合服务，只用于轨迹查询与推送接收）。
    # 密钥从环境变量注入：export SHOP_KDNIAO_ENABLED=true SHOP_KDNIAO_EBUSINESS_ID=… SHOP_KDNIAO_APP_KEY=…
    # 未配置时应用照常启动，只是轮询任务与推送端点都不工作（网关 available()=false）——
    # 轨迹仍可由平台运营经 admin 端点补录。推送端点必须配密钥才能用：它 fail-close，没密钥一律 403
    logistics:
        kdniao:
            enabled: "${SHOP_KDNIAO_ENABLED:false}"
            ebusiness-id: "${SHOP_KDNIAO_EBUSINESS_ID:}"
            app-key: "${SHOP_KDNIAO_APP_KEY:}"
    # 七牛云对象存储（图片直传）。密钥从环境变量注入，绝不写死进仓库（AK/SK 一旦泄露等于账号裸奔）：
    # OS:  export QINIU_ACCESS_KEY=… QINIU_SECRET_KEY=…
    # 未配置密钥时应用照常启动，只有调用上传凭证接口时才报错（见 QiniuClient.ensureConfigured）。
    # upload-host 按空间区域填（见 QiniuProperties 注释）；public-base-url 用控制台绑定的域名
    qiniu:
        access-key: "${QINIU_ACCESS_KEY:}"
        secret-key: "${QINIU_SECRET_KEY:}"
        bucket: "${QINIU_BUCKET:}"
        upload-host: "${QINIU_UPLOAD_HOST:}"
        public-base-url: "${QINIU_PUBLIC_BASE_URL:}"
