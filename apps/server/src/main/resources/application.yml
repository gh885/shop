server:
    port: ${SERVER_PORT:8080}

spring:
    config:
        # 本地开发读 apps/server/.env（gitignored）；部署环境没有这个文件就忽略。
        import: "optional:file:./.env[.properties]"
    application:
        name: shop-server
    datasource:
        # 本地数据面由 compose.dev.yml 提供，PG 映射到 15432
        url: jdbc:postgresql://${SHOP_DB_HOST:127.0.0.1}:${SHOP_DB_PORT:15432}/shop
        username: ${SHOP_DB_USER:shop}
        password: ${SHOP_DB_PASSWORD:shop}
    data:
        redis:
            host: ${SHOP_REDIS_HOST:127.0.0.1}
            port: ${SHOP_REDIS_PORT:6379}
    flyway:
        # 迁移脚本随业务模块一起重建，见 docs/domain/module-map.md
        enabled: false
    jackson:
        deserialization:
            fail-on-unknown-properties: true

mybatis-plus:
    configuration:
        map-underscore-to-camel-case: true

management:
    endpoints:
        web:
            exposure:
                include: health,prometheus

logging:
    level:
        root: INFO
        org.springframework: WARN
